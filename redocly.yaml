# Lint settings for `npm test` (Redocly CLI, open source). The site itself is
# built by scripts/build.mjs and published to GitHub Pages; nothing here
# configures it.
extends:
  - recommended

rules:
  operation-4xx-response: off
  no-invalid-media-type-examples: off
  no-unused-components: error
  no-server-example.com: off
