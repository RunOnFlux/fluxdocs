  /daemon/startfluxnode:
    get:
      tags:
        - Daemon
      summary: Start FluxNode commmand
      description: >-
        Attempts to start one or more FluxNode. This call will only work if
        running a hot FluxNode which is highly not recommended. It is a control
        wallet function so basically your wallet containing the collateral
        funds. **Admin**
      operationId: startFluxNode
      security:
        - FluxID: []
      parameters:
        - in: query
          name: set
          required: true
          schema:
            type: string
          description: Specify which set of FluxNode(s) to start.
          example: alias
        - in: query
          name: lockwallet
          required: true
          schema:
            type: boolean
            enum:
              - true
              - false
          description: |
            Lock wallet after completion.

            Example:
            - `set`=`<alias>`&`lockwallet`=`false`
        - in: query
          name: alias
          required: false
          schema:
            type: string
          description: FluxNode alias. Required if using 'alias' as the set.
          example: Super1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/startfluxnode'
              example:
                status: success
                data:
                  overall: 'Successfully started 0 fluxnodes, failed to start 1, total'
                  detail:
                    - result: failed
                      error: could not find alias in config. Verify with list-conf.
  /daemon/startdeterministicfluxnode:
    get:
      tags:
        - Daemon
      summary: Start fluxnode command
      description: >-
        Attempts to start one fluxnode. Same as the `/daemon/startfluxnode` call
        this call will only work if running a hot FluxNode which is highly not
        recommended. It is a control wallet function so basically your wallet
        containing the collateral funds.  **Admin**
      operationId: startDeterministicFluxNode
      security:
        - FluxID: []
      parameters:
        - in: query
          name: alias
          required: true
          schema:
            type: string
          description: Node name or alias.
          example: Basic1
        - in: query
          name: lockwallet
          required: false
          schema:
            type: boolean
            default: false
            enum:
              - true
              - false
          description: |
            Lock wallet after completion.

            Example:
            - `alias`=`<alias`&`lockwallet`=`false`
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/startfluxnode'
              example:
                status: success
                data:
                  overall: 'Successfully started 0 fluxnodes, failed to start 1, total'
                  detail:
                    - alias: Basic1
                      result: failed
                      error: could not find alias in config. Verify with list-conf.
  /daemon/verifychain:
    get:
      tags:
        - Daemon
      summary: Verify blockchain data
      description: Verifies blockchain database. **Admin**
      operationId: verifyChain
      security:
        - FluxID: []
      parameters:
        - in: query
          name: checklevel
          schema:
            type: integer
            default: 3
            enum:
              - 0
              - 1
              - 2
              - 3
              - 4
          description: |
            How thorough the block verification is.

            Example:
            - `checklevel`=`1`
        - in: query
          name: numblocks
          schema:
            type: integer
            default: 288
          description: The number of blocks to check
