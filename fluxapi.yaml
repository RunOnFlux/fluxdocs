  #ArcaneOS
  /arcane/authchallenge:
    get:
      tags:
        - ArcaneOS
      summary: Request a configuration challenge
      description: >-
        Issues a one-time challenge bound to the requester's IP address, to be
        answered by `POST /arcane/configsync`. HTTPS only.


        Available **only on ArcaneOS nodes** — every other node answers `501`. A
        node whose `flux-configd` is not reachable answers `502`, and a requester
        that has exhausted its challenge allowance answers `429`. **Public**
      operationId: arcaneAuthChallenge
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      challenge:
                        type: string
              example:
                status: success
                data:
                  challenge: 8f14e45fceea167a5a36dedd4bea2543
        '400':
          description: Requester IP address could not be determined
        '403':
          description: Not an HTTPS connection (`ForbiddenProtocol`)
        '429':
          description: Challenge limit reached for this requester
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          description: Not an ArcaneOS node
        '502':
          description: '`flux-configd` is not available'
  /arcane/configsync:
    post:
      tags:
        - ArcaneOS
      summary: Synchronise node configuration
      description: >-
        Applies a signed configuration to an ArcaneOS node. Answer a challenge
        from `GET /arcane/authchallenge` with its encrypted form and a signature
        over it, alongside the configuration to apply. HTTPS only.


        Available **only on ArcaneOS nodes** — every other node answers `501`,
        and a node whose `flux-configd` is not reachable answers `502`. **Public**
        (the signed challenge is the credential)
      operationId: arcaneConfigSync
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - challenge
                - encryptedChallenge
                - signature
                - configData
              properties:
                challenge:
                  type: string
                  description: The challenge as issued
                encryptedChallenge:
                  type: string
                signature:
                  type: string
                configData:
                  type: object
                  description: The configuration to apply
            example:
              challenge: 8f14e45fceea167a5a36dedd4bea2543
              encryptedChallenge: BASE64...
              signature: H+ZB3oSrsw6XkBxxlbwk33LEBJ...
              configData:
                apiport: 16127
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: Configuration synchronised
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: The challenge answer failed authentication
        '403':
          description: Not an HTTPS connection (`ForbiddenProtocol`)
        '501':
          description: Not an ArcaneOS node
        '502':
          description: '`flux-configd` is not available'
  #Host information (application containers)
  /hostinfo:
    servers:
      - url: 'http://169.254.43.43:16101'
        description: >-
          The node's host-information listener, reachable only from application
          containers on that node
    get:
      tags:
        - Apps
      summary: Host information for an app container
      description: >-
        Lets an application learn about the node it runs on. Served by a
        separate listener on port `16101`, bound to the link-local address
        `169.254.43.43`, so only the node's application containers can reach it.


        The caller is identified by its socket address: it must lie inside the
        subnet of an application's Flux Docker network, and that application is
        named in `appName`. Any other caller is answered with the unauthorized
        error envelope. No `zelidauth` header is read.


        `id` is the node's collateral identifier (collateral transaction hash
        followed by its output index). `ip` is the node's public IP without the
        port. `geo` is the node's geolocation record without its `ip` and `org`
        fields. `benchmark` holds the node's benchmarked resources, from the
        live benchmark when it reports a valid tier and from the last stored
        benchmark otherwise; `eps_singlethread` appears only when the benchmark
        reports it. When the collateral, IP, geolocation or benchmark is not
        available yet, the call answers an error envelope naming which.
        **Public** (application containers on this node only)
      operationId: getHostInfo
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      appName:
                        type: string
                        description: The application whose container is calling
                      id:
                        type: string
                        description: Collateral transaction hash followed by its output index
                      ip:
                        type: string
                        description: The node's public IP
                      geo:
                        type: object
                        description: The node's geolocation record, without `ip` and `org`
                      benchmark:
                        type: object
                        properties:
                          vcores:
                            type: number
                          ram:
                            type: number
                          disk:
                            type: number
                          diskwritespeed:
                            type: number
                          eps:
                            type: number
                          download_speed:
                            type: number
                          upload_speed:
                            type: number
                          eps_singlethread:
                            type: number
              example:
                status: success
                data:
                  appName: myapp
                  id: 405e86b48a5d6846763f260154ca15383854ce5a2efad31474e55ff60cb629790
                  ip: 185.199.108.1
                  geo:
                    continent: Europe
                    continentCode: EU
                    country: Germany
                    countryCode: DE
                    region: HE
                    regionName: Hesse
                    lat: 50.1109
                    lon: 8.6821
                    isp: Hetzner Online GmbH
                    asn: AS24940 Hetzner Online GmbH
                    mobile: false
                    proxy: false
                    hosting: true
                    static: true
                    dataCenter: true
                  benchmark:
                    vcores: 8
                    ram: 7.1
                    disk: 220
                    diskwritespeed: 540.25
                    eps: 489.2
                    download_speed: 150.45
                    upload_speed: 50.21
  #Payments
  /payment/paymentrequest:
    get:
      tags:
        - Payments
      summary: Create a payment request
      description: >-
        Issues an id for one browser-and-wallet meeting. The page that wants
        paying listens on this node's WebSocket `/ws/payment/<paymentId>` and
        hands the wallet a callback to
        `POST /payment/verifypayment?paymentid=<paymentId>`; the transaction id
        the wallet posts there is delivered to that listener and to nothing
        else. The id (`<ms timestamp>_<32 hex chars>`) is unguessable, held in
        the issuing node's memory for one hour, valid only on that node, and
        spent once delivered (or dropped when the listening socket closes
        before an answer). Issuance is limited per caller address (the socket
        peer, or the address a recognised balancer reports): more than 5 per
        second answers `429` `Too many payment requests`, and a caller already
        holding 10 pending ids answers `429` `Too many pending payment
        requests`. **Public**
      operationId: paymentRequest
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      paymentId:
                        type: string
              example:
                status: success
                data:
                  paymentId: '1772719200000_3f9a1c0e7b2d4a6f8e1c3b5d7f9a2c4e'
        '429':
          description: Issuance rate (5/s) or pending-id cap (10) for this caller exceeded
  /payment/verifypayment:
    post:
      tags:
        - Payments
      summary: Deliver a wallet payment callback
      description: >-
        The callback a wallet posts after broadcasting its transaction. The
        transaction id (`transaction_id`, as ZelCore sends it, or `txid`; a
        string of at most 500 characters) is handed to the browser listening on
        `/ws/payment/<paymentid>` for an id minted by
        `GET /payment/paymentrequest` on this node, and the id is spent once the
        browser receives it. Nothing is verified and nothing is recorded: the
        transaction id is relayed as a claim, not checked against any chain (an
        app is paid when a transaction on chain matches its message hash). Any
        content type is accepted; a body no parser claims is limited to 10,000
        bytes (`413`). Validation failures (`No payment ID is specified`,
        `Invalid payment ID format`, `No transaction ID is specified`,
        `Transaction ID must be a string`, `Invalid transaction ID length`,
        `Payment request not found or has expired`) are error envelopes.
        **Public**
      operationId: verifyPayment
      security: []
      parameters:
        - in: query
          name: paymentid
          required: false
          schema:
            type: string
          description: Payment request id, when not sent in the body
          example: '1772719200000_k3j9xq2mv8p'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentid:
                  type: string
                transaction_id:
                  type: string
                  description: Transaction id as sent by ZelCore
                txid:
                  type: string
                  description: Transaction id (equivalent to `transaction_id`)
            example:
              paymentid: '1772719200000_3f9a1c0e7b2d4a6f8e1c3b5d7f9a2c4e'
              transaction_id: 9f2c1e...
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      paymentId:
                        type: string
                      txid:
                        type: string
                      success_url:
                        type: string
              example:
                status: success
                data:
                  message: Payment received successfully
                  paymentId: '1772719200000_3f9a1c0e7b2d4a6f8e1c3b5d7f9a2c4e'
                  txid: 9f2c1e...
                  success_url: https://home.runonflux.io/successcheckout
        '413':
          description: Request body too large
        '500':
          $ref: '#/components/responses/InternalServerError'
  #Syncthing - metrics and diagnostics
  /syncthing/metrics:
    get:
      tags:
        - Syncthing
      summary: Full Syncthing metrics
      description: >-
        A complete snapshot of this node's Syncthing state — health, system,
        connections and per-folder figures — collected at request time.
        **FluxTeam**
      operationId: getSyncthingMetrics
      security:
        - FluxID: []
