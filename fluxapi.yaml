  /apps/appendbackuptask:
    post:
      tags:
      - Backup/Restore
      summary: Append backup task to an application
      description: Append backup task to an application. **AppOwnerAbove**
      operationId: fluxAppendbackuptask
      security:
        - FluxID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appname:
                  type: string
                  description: Name of the application
                  example: FoldingAtRunOnFlux11
                force:
                  type: boolean
                  default: false
                  description: >-
                    Archive a synced component even when this node's copy is not
                    confirmed fully synced; otherwise that is refused with the
                    sync shortfall.
                backup:
                  type: array
                  items:
                    type: object
                    properties:
                      component:
                        type: string
                        description: Name of component
                        example: FoldingAtHome
                      backup:
                        type: boolean
                        description: Whether to perform backup for the component
                        example: true
              example:
                appname: FoldingAtRunOnFlux11
                backup:
                  - component: FoldingAtHome
                    backup: true
      responses:
        '200':
          description: >-
            A stream of plain-text progress lines; a refusal is written into it
            as a line too.
          content:
            text/plain:
              schema:
                type: string
  /apps/appendrestoretask:
    post:
      tags:
      - Backup/Restore
      summary: Append restore task to an application
      description: Append restore task to an application. **AppOwnerAbove**
      operationId: fluxAppendrestoretask
      security:
        - FluxID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - appname
                - type
                - restore
              properties:
                appname:
                  type: string
                  description: Name of the application
                  example: FoldingAtRunOnFlux11
                type:
                  type: string
                  enum:
                    - local
                    - remote
                    - upload
                  description: >-
                    Where each component's archive comes from: the volume's
                    backup/local or backup/upload folder, file
                    `backup_<component>.tar.gz` with the component name
                    lower-cased; or, for `remote`, downloaded first from each
                    entry's `url`.
                force:
                  type: boolean
                  default: false
                  description: >-
                    Skip the check that refuses restoring a g: (elected) component
                    on a node other than its current primary.
                restore:
                  type: array
                  items:
                    type: object
                    properties:
                      component:
                        type: string
                        description: Name of component
                        example: FoldingAtHome
                      restore:
                        type: boolean
                        description: Whether to restore this component
                        example: true
                      url:
                        type: string
                        description: Archive URL; required for each restored component when `type` is `remote`
              example:
                appname: FoldingAtRunOnFlux11
                type: local
                restore:
                  - component: FoldingAtHome
                    restore: true
      responses:
        '200':
          description: >-
            A stream of plain-text progress lines; a refusal is written into it
            as a line too.
          content:
            text/plain:
              schema:
                type: string
  #IOUtils
  /ioutils/fileupload:
    post:
      tags:
        - IOUtils
      summary: Upload file
      description: Uploads a file to the specified location. **AppOwnerAbove**
      operationId: fileUpload
      security:
        - FluxID: []
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
          description: >-
            `backup` stores the upload in the component volume's backup/upload
            folder (where appendrestoretask with type upload reads
            backup_<component>.tar.gz) and ignores `folder`; any other value, or
            none, stores it in `folder`.
          example: backup
        - in: query
          name: appname
          required: true
          schema:
            type: string
          description: Name of the application
          example: FoldingAtRunOnFlux11
        - in: query
          name: component
          required: true
          schema:
            type: string
          description: Component of application
          example: FoldingAtHome
        - in: query
          name: folder
          required: false
          schema:
            type: string
          description: Folder relative to the volume root (created if missing); the volume root when omitted.
          example: ddd/ccc
        - in: query
          name: filename
          required: false
          schema:
            type: string
          description: >-
            Name to store the upload under. When omitted, each file is stored
            under its multipart field name (not the file's original name), so a
            client appends each file under the name it should have.
          example: FoldingAtHome.gzip
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: >-
            A stream rather than one JSON document: `[bytesReceived,bytesExpected]`
            pairs as the body arrives, then each stored file's name as it lands.
            A failure after the stream has started is written into it as the
            error envelope.
          content:
            text/plain:
              schema:
                type: string
              example: '[65536,1048576][1048576,1048576]backup_foldingathome.tar.gz'
        '503':
          description: >-
            Refused before any work starts: another file operation is running
            for this application, the node is at its concurrent-operation limit,
            the file-operation image is still being fetched, or the node is
            still reconciling its applications after boot. `Retry-After` says
            when to retry; `data.operation` (jobId, kind, statusUrl) names the
            operation being waited behind, when there is one.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
  #Daemon
  /daemon/help:
    get:
      tags:
        - Daemon
      summary: RPC list
      description: >-
        Gets list of RPC for the Flux daemon or if command query is used it
        will respond with the help info for that specified call. The list is
        fluxd's own and still names its wallet and shielded-pool RPCs; FluxOS
        has not routed those since 8.19.0. **Public**
      operationId: help
      security: []
      parameters:
        - in: query
          name: command
          schema:
            type: string
          description: >-
            Accepts both help/command and ?command=getinfo. If omited, default
            help will be displayed.
          example: getmininginfo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: string
                    description: RPC list
              example:
                status: success
                data: >-
                    == Addressindex ==
                    getaddressbalance {"addresses": ["taddr", ...]}
                    getaddressdeltas {"addresses": ["taddr", ...], ("start": n), ("end": n), ("chainInfo": true|false)}
                    getaddressmempool {"addresses": ["taddr", ...]}
                    getaddresstxids {"addresses": ["taddr", ...], ("start": n), ("end": n)}
