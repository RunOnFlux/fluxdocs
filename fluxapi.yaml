                    type: string
              example:
                status: success
                data: 10d0954961e0a2f3c5b7d8e9f0a1b2c3d4e5f607
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /flux/rebuildui:
    get:
      tags:
        - Flux
      summary: Reinstall the FluxOS UI
      description: >-
        Fetches the published CloudUI release again and reinstalls it,
        unconditionally — the periodic check stands down when the installed hash
        already matches the release, and a UI that is damaged rather than out of
        date matches all the same. Repairing one is what this is for.


        Refused on ArcaneOS, where the watchdog owns CloudUI; the refusal names
        the component to ask instead. Replaces the removed `/flux/rebuildhome`.
        **AdminAndFluxTeam**
      operationId: rebuildUi
      security:
        - FluxID: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: CloudUI rebuilt
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /flux/eventstream:
    get:
      tags:
        - Flux
      summary: Server-sent event stream
      description: >-
        A `text/event-stream` of FluxOS events. Each event carries a monotonic
        `id`; send it back in the `Last-Event-ID` header to resume.


        A resuming consumer that fell behind the retention ring is told so
        *before* it is handed the survivors: a `stream:gap` event names
        `afterId`, `oldestRetainedId` and how many events were `dropped`. Silence
        here is what turns a dropped event into a timeout somewhere else
        entirely. A `: keepalive` comment is written every 15 seconds.


        Answers `404` on nodes where the event stream is not enabled. **Public**
      operationId: eventStream
      security: []
      parameters:
        - in: header
          name: Last-Event-ID
          required: false
          schema:
            type: integer
          description: Resume after this event id
          example: 4211
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: stream:gap
                data: {"afterId":4211,"oldestRetainedId":4300,"dropped":88}
                id: 4211

                event: app:installed
                data: {"app":"myapp"}
                id: 4301
        '404':
          description: Event stream not enabled on this node
  /flux/testcounters:
    get:
      tags:
        - Flux
      summary: Internal event counters (test builds only)
      description: >-
        The internal event counters the event bus keeps. Available only on nodes
        where the test event stream is enabled; every other node answers `404`.
        **Public**
      operationId: testCounters
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
              example:
                status: success
                data:
                  app:
                    installed: 3
        '404':
          description: Test counters not enabled on this node
  /flux/zelid:
    get:
      tags:
