  /apps/testappinstall/{appname}:
    get:
      tags:
        - Apps
      summary: Test application installation
      description: >-
        Test if an application can be installed without actually installing it.
        Any logged-in user may test a pending registration by passing its
        temporary-message hash as `appname`; testing an application already
        known to the network (by name) requires the Flux Team. The response is
        streamed, like `GET /apps/installapplocally/{appname}`; on a node whose
        architecture the images do not support, it reports that validation
        passed and the installation was skipped.
        **User** (a known application: **FluxTeam**)
      operationId: testAppInstall
      security:
        - FluxID: []
      parameters:
        - name: appname
          in: path
          required: true
          schema:
            type: string
          description: Name of the application to test
          example: electrumxtest
      responses:
        '200':
          description: Stream of test-installation progress objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/streamdata'
              example:
                status: 'Checking architecture compatibility...'
        '503':
          description: >-
            Refused before the handler runs: the node is still reconciling its
            applications after boot (Retry-After 15), or has not yet obtained the
            network policy — the signed bundle carrying the blocked-repository
            list — so it cannot establish that an image is allowed (Retry-After 30).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
              example:
                status: error
                data:
                  code: 503
                  name: ServiceUnavailable
                  message: Node has not yet obtained the network policy
  /apps/installapplocally/{appname}:
    get:
      tags:
        - Apps
      summary: Install application locally
      description: >-
        Installs a specific application locally on this node. The response is
        **streamed**: a sequence of JSON objects is written as the install
        progresses — image pull progress, volume creation, container start — and
        the connection closes when the install finishes or fails. A failure after
        the stream has started is written into the stream rather than signalled by
        the HTTP status, so read the objects rather than the status code.


        Any logged-in user may install a pending registration by passing its
        temporary-message hash as `appname`; installing an application already
        known to the network (by name) requires the Flux Team. Refused while
        another application on this node is undergoing an operation.
        **User** (a known application: **FluxTeam**)
      operationId: installAppLocally
      security:
        - FluxID: []
      parameters:
        - name: appname
          in: path
          required: true
          schema:
            type: string
          description: Name of the application to install
          example: electrumxtest
      responses:
        '200':
          description: Stream of installation progress objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/streamdata'
              example:
                status: 'Downloading image'
                progressDetail:
                  current: 41943040
                  total: 104857600
                progress: '[=========>          ]  40MB/100MB'
                id: 6a1f8b3c9d2e
        '503':
          description: >-
            Refused before the handler runs: the node is still reconciling its
            applications after boot (Retry-After 15), or has not yet obtained the
            network policy — the signed bundle carrying the blocked-repository
            list — so it cannot establish that an image is allowed (Retry-After 30).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
              example:
                status: error
                data:
                  code: 503
                  name: ServiceUnavailable
                  message: Node has not yet obtained the network policy
  /apps/redeploy/{appname}:
    get:
      tags:
        - Apps
      summary: Redeploy application
      description: >-
        Redeploy an existing application on this node. Component names
        (containing `_`) are refused, and the redeploy is skipped with a warning
        while a restore runs for the application. The response is streamed;
        with `global` it is a single envelope (`<app> queried for global
        hard|soft redeploy`). **AppOwnerAbove**
      operationId: redeployAPI
      security:
        - FluxID: []
      parameters:
        - name: appname
          in: path
          required: true
          schema:
            type: string
          description: Name of the application to redeploy
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Hard redeploy — removes the application's volumes and data on this node
        - name: global
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Redeploy globally across network
      responses:
        '200':
          description: >-
            A stream of JSON objects written as the work progresses — progress
            objects and status envelopes — ending when it finishes or fails. A
            failure after the stream has started is written into it rather than
            signalled by the HTTP status.
          content:
            application/json:
              schema:
                type: object
              example:
                status: success
                data:
                  message: Application softly removed. Awaiting installation...
        '503':
          description: >-
            Refused before the handler runs: the node is still reconciling its
            applications after boot (Retry-After 15), or has not yet obtained the
            network policy — the signed bundle carrying the blocked-repository
            list — so it cannot establish that an image is allowed (Retry-After 30).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
              example:
                status: error
                data:
                  code: 503
