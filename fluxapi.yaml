    description: >-
      **Identity & User Management**
      
      Comprehensive identity management endpoints that handle user authentication, authorization 
      levels, and identity verification across multiple blockchain addresses (Bitcoin P2PKH, 
      Ethereum, FluxID). These endpoints manage user sessions, permissions, and access control 
      throughout the Flux ecosystem.
      
      **Supported Address Types:**
      - Bitcoin P2PKH addresses
      - Ethereum addresses  
      - FluxID addresses
      - Multi-signature addresses
      
  - name: Daemon
    description: >-
      **Flux Daemon Operations**
      
      Core blockchain daemon endpoints for interacting with the underlying Flux blockchain node.
      These endpoints provide access to blockchain data, mining information,
      network statistics, and node management functions. Essential for node operators and 
      developers building blockchain-integrated applications.
      A fluxnode has no wallet: FluxOS exposes no wallet or shielded-pool RPCs (removed in 8.19.0).
      
      **Core Functions:**
      - Blockchain state queries
      - Raw transaction creation, decoding and broadcasting
      - Network information
      - Mining and staking operations
      
  - name: Benchmark
    description: >-
      **Node Performance & Benchmarking**
      
      Endpoints for monitoring and managing Flux node performance benchmarks. These APIs provide
      access to hardware specifications, performance metrics, benchmark results, and node tier
      qualification status. Critical for node operators to ensure optimal performance and 
      maintain network participation requirements.
      
      **Monitoring Capabilities:**
      - Hardware specification reporting
      - Performance benchmark execution
      - Node tier status verification
      - Resource utilization metrics
      - Network connectivity testing
      
  - name: Flux
    description: >-
      **Flux Network Operations**
      
      Core network endpoints for interacting with the broader Flux decentralized network.
      These APIs provide access to network statistics, node information, consensus data,
      and network-wide operations that facilitate the decentralized cloud infrastructure.
      
      **Network Services:**
      - Node discovery and registry
      - Network consensus information
      - Global network statistics
      - Peer-to-peer communication
      - Distributed coordination
      
  - name: Apps
    description: >-
      **Decentralized Application Management**
      
      Comprehensive endpoints for deploying, managing, and monitoring decentralized applications 
      (dApps) on the Flux network. These APIs handle the complete application lifecycle from 
      deployment to scaling, including Docker container management, resource allocation, and 
      global distribution across the Flux node network.
      
      **Application Services:**
      - Docker-based app deployment
      - Application lifecycle management
      - Resource scaling and allocation
      - Multi-region distribution
      - Application marketplace integration
      - Performance monitoring and analytics
      
  - name: Explorer
    description: >-
      **Blockchain Explorer Services**
      
      Blockchain exploration endpoints providing detailed access to on-chain data, transaction 
      history, address information, and network analytics. These APIs power blockchain explorers
      and provide developers with comprehensive blockchain data access for building analytics
      and monitoring applications.
      
      **Explorer Features:**
      - Transaction history and details
      - Address balance and activity
      - Block information and statistics
      - Network-wide analytics
      - Search and filtering capabilities
      
  - name: Syncthing
    description: >-
      **Distributed File Synchronization**
      
      Endpoints for managing Syncthing-based distributed file synchronization services.
      These APIs enable secure, decentralized file sharing and synchronization across
      Flux nodes, providing reliable data distribution and backup capabilities for
      decentralized applications and user data.
      
      **Synchronization Services:**
      - Peer-to-peer file synchronization
      - Distributed storage management
      - Conflict resolution
      - Encryption and security
      - Bandwidth optimization
      
  - name: Fluxshare
    description: >-
      **Decentralized File Sharing**
      
      Advanced file sharing and storage endpoints built on the Flux decentralized network.
      FluxShare provides secure, distributed file storage with redundancy, encryption,
      and global accessibility. Ideal for building decentralized storage applications
      and content distribution networks.
      
      **Storage Features:**
      - Distributed file storage
      - Redundancy and fault tolerance
      - End-to-end encryption
      - Global content distribution
      - Access control and sharing permissions
      
  - name: Backup/Restore
    description: >-
      **Application Backup & Recovery**
      
      Comprehensive backup and disaster recovery endpoints for Flux applications and data.
      These APIs provide automated backup creation, version management, and restoration
      capabilities to ensure data integrity and business continuity for decentralized
      applications running on the Flux network.
      
      **Backup Services:**
      - Automated backup scheduling
      - Version control and history
      - Cross-region replication  
      - Point-in-time recovery
      - Disaster recovery orchestration
      
  - name: Volume Browser
    description: >-
      **Persistent Storage Management**
      
      Advanced volume and persistent storage management endpoints for containerized applications.
      These APIs provide comprehensive file system operations, storage allocation, and data
      management capabilities for applications requiring persistent data storage across
      the distributed Flux network.
      
      **Storage Management:**
      - Volume provisioning and management
      - File system operations
      - Storage quota enforcement
      - Data migration and replication
      - Performance optimization
      
  - name: IOUtils
    description: >-
      **File System Operations & Utilities**
      
      Low-level file system operation endpoints providing essential I/O utilities for
      application development and system administration. These APIs offer direct file
      manipulation, directory management, and system utilities required for advanced
      application deployment and management on Flux nodes.
      
      **I/O Operations:**
      - File and directory management
      - Permission and ownership control
      - Data transfer utilities
      - System resource monitoring
      - Batch operation support
  - name: ArcaneOS
    description: >-
      **Hardened Node Operating System**

      Endpoints exposed only by nodes running ArcaneOS, the hardened FluxOS
      appliance image. They cover attested configuration synchronisation, where
      the node's identity keys are held by the operating system rather than by
      FluxOS. Every other node answers these routes with `501 Not Implemented`.

      **ArcaneOS Capabilities:**
      - Hardware-backed key custody
      - Challenge/response configuration sync via `flux-configd`
      - Watchdog-managed CloudUI
      - HTTPS-only endpoints

  - name: Payments
    description: >-
      **Wallet Payment Callbacks**

      A rendezvous between a web page and a wallet it opens. The page mints a
      payment id on a node, listens on that node's `/ws/payment/<paymentId>`
      WebSocket, and gives the wallet a callback to
      `POST /payment/verifypayment?paymentid=<paymentId>`; the transaction id
      the wallet posts there is delivered to the waiting page. The node relays
      the transaction id as a claim and records nothing: it is not a payment
      verification.

      **Payment Services:**
      - Payment id issuance, rate-limited per caller
      - Wallet callback relay to the waiting browser

