                  000000234b617194f3faff69ee62f0dde0115f2007c3b42e38eaba80c786a5e5
  /daemon/getblockheader:
    get:
      tags:
        - Daemon
      summary: Block header info
      description: Returns an Object with information about blockheader. **Public**
      operationId: getBlockHeader
      security: []
      parameters:
        - in: query
          name: hash
          required: true
          schema:
            type: string
          description: Block hash to get header info from
          example: 000000234b617194f3faff69ee62f0dde0115f2007c3b42e38eaba80c786a5e5
        - in: query
          name: verbose
          schema:
            default: true
            type: boolean
            enum:
              - true
              - false
          description: |
            If verbose is false, returns a string that is serialized,
            hex-encoded data for blockheader 'hash'. If verbose is true, returns
            an Object with information about blockheader hash.


            Example:

            - `hash`=`<block hash>`&`verbose`=`true`
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      hash:
                        type: string
                        description: Block hash
                      confirmations:
                        type: integer
                        description: Number of confirmations
                      height:
                        type: integer
                        description: Block height
                      version:
                        type: integer
                        description: Block version
                      merkleroot:
                        type: string
                        description: The merkle root
                      finalsaplingroot:
                        type: string
                        description: >-
                          The root of the Sapling commitment tree after applying
                          this block
                      time:
                        type: integer
                        description: The block time in seconds since epoch (Jan 1 1970 GMT)
                      nonce:
                        type: string
                        description: The nonce
                      solution:
                        type: string
                        description: The solution
                      bits:
                        type: string
                        description: The bits
                      difficulty:
                        type: number
                        description: The difficulty
                      chainwork:
                        type: string
                        description: Chainwork hash
                      previousblockhash:
                        type: string
                        description: Hash of previous block
                      nextblockhash:
                        type: string
                        description: Hash of next block
              example:
                status: success
                data:
                  hash: >-
                    000000234b617194f3faff69ee62f0dde0115f2007c3b42e38eaba80c786a5e5
                  confirmations: 9
                  height: 590823
                  version: 4
