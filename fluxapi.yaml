                hexstring:
                  type: string
                  description: Hex-encoded transaction
                allowhighfees:
                  type: boolean
                  default: false
                  description: Allow high fees (optional)
            example:
              hexstring: >-
                
              allowhighfees: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: string
                    description: The transaction hash in hex
              example:
                status: success
                data: >-
                  381bfe56a049208ff90356153f024395b7a74b5ec470d639dd7e6ffa4487b2fe
    get:
      tags:
        - Daemon
      summary: Send raw transaction
      description: >-
        Submits raw transaction (serialized, hex-encoded) to local node and
        network. Also see createrawtransaction and decoderawtransaction. FluxOS
        offers no signing call (a fluxnode has no wallet); sign the transaction
        before sending it. **Public**
      operationId: sendRawTransaction
      security: []
      parameters:
        - in: query
          name: hexstring
          required: true
          schema:
            type: string
          description: The hex string of the raw transaction
          example: >-
            
        - in: query
          name: allowhighfees
          schema:
            default: false
            type: boolean
            enum:
