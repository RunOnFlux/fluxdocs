                        type: boolean
                      syncProgress:
                        type: number
                      issues:
                        type: array
                        items:
                          type: string
                      health:
                        type: object
                      system:
                        type: object
                      connections:
                        type: object
                      folders:
                        type: object
              example:
                status: success
                data:
                  timestamp: 1772719200000
                  healthy: true
                  syncProgress: 100
                  issues: []
                  health:
                    status: OK
                    error: null
