  /daemon/gettxout:
    get:
      tags:
        - Daemon
      summary: Unspent transaction output
      description: >-
        Returns details about an unspent transaction output (fluxd `gettxout`).
        **Public**
      operationId: getTxOut
      security: []
      parameters:
        - in: query
          name: txid
          required: true
          schema:
            type: string
          description: The transaction id
          example: 9e3cdde1b7c92728a1200a988bb046028fe93b9f1e15cc370974f7201d3d3a94
        - in: query
          name: 'n'
          required: true
          schema:
            type: integer
          description: Vout value
          example: 1
        - in: query
          name: includemempool
          schema:
            default: true
            type: boolean
            enum:
              - true
              - false
          description: >
            Whether to include the mempool.


            Example:

            - `txid`=`<transaction id>`&`n`=`<vout
            value>`&`includemempool`=`true`
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      bestblock:
                        type: string
                        description: Block hash
                      confirmations:
                        type: integer
                        description: The number of confirmations
                      value:
                        type: number
                        description: The transaction value in FLUX
                      scriptPubKey:
                        type: object
                        properties:
                          asm:
                            type: string
                            description: Script public key
                          hex:
                            type: string
                            description: Hex
                          reqSigs:
                            type: number
                            description: Number of required signatures
                          type:
                            type: string
                            description: 'The type, eg pubkeyhash'
                          addresses:
                            type: array
                            items:
                              type: string
                      version:
                        type: integer
                        description: The version number
                      coinbase:
                        type: boolean
                        description: Coinbase or not
              example:
                status: success
                data:
                  bestblock: >-
                    0000001dca878efaa3ae059492bd108cd2e53708325f609f21ffb948f8769115
                  confirmations: 9
                  value: 9.375
                  scriptPubkey:
                    asm: >-
                      OP_DUP OP_HASH160 961f695fbc075b7f99f0b45323206930340efc98
                      OP_EQUALVERIFY OP_CHECKSIG
                    hex: 76a914961f695fbc075b7f99f0b45323206930340efc9888ac
                    reqSigs: 1
                    type: pubkeyhash
                    addresses:
                      - t1XZNzdMMDZ4QPRD2a6hHWQ4Mog3HF9mCMp
                  version: 4
                  coinbase: true
