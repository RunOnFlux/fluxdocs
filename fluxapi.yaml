              type: array
              description: Detailed validation errors
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: Field name that failed validation
                  message:
                    type: string
                    description: Validation error message
    InternalServerError:
      type: object
      description: Internal server error
      properties:
        status:
          type: string
          enum:
            - error
        data:
          type: object
          properties:
            name:
              type: string
              example: 'InternalError'
            message:
              type: string
              example: 'Internal server error occurred'
            code:
              type: string
              example: 'INTERNAL_ERROR'
    ServiceUnavailableError:
      type: object
      description: Service temporarily unavailable
      properties:
        status:
          type: string
          enum:
            - error
        data:
          type: object
          properties:
            name:
              type: string
              example: 'ServiceUnavailable'
            message:
              type: string
              example: 'Service is temporarily unavailable'
            code:
              type: string
              example: 'SERVICE_UNAVAILABLE'
  responses:
    OperationAccepted:
      description: >-
        The work was accepted and is running. Poll the `statusUrl` — completion
        is read from the operation's `status` field, never from this response.
      headers:
        Location:
          description: The operation's status URL
          schema:
            type: string
        Operation-Id:
          description: The operation id
          schema:
            type: string
        Retry-After:
          description: Seconds to wait before the first poll
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                $ref: '#/components/schemas/status'
              data:
                type: object
                properties:
                  jobId:
                    type: string
                  statusUrl:
                    type: string
                  status:
                    type: string
          example:
            status: success
            data:
              jobId: op_2f8f1a1c-1a2b-4c3d-9e8f-0a1b2c3d4e5f
              statusUrl: /apps/operations/op_2f8f1a1c-1a2b-4c3d-9e8f-0a1b2c3d4e5f
              status: Running
    UnauthorizedError:
      description: Authentication failed or insufficient privileges
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
    ServiceUnavailableError:
      description: Service temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceUnavailableError'
  securitySchemes:
    FluxID:
      description: >-
        FluxID (formerly ZelID) is an authentication system based on Bitcoin message signing and Ethereum personal sign.
        The header keeps its original name, `zelidauth`: a query string of zelid,
        signature and loginPhrase (see Authentication Workflows for how to obtain
        one). An example of a header is
        `zelid=1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC&signature=%2BZB3oSrsw6XkBxxlbwk33LEBJYvqtbMIm2kL9JzuoXMC6pSZd0lBHdnhJYzMTXv81zZQ7G%2FpkK1NvYN7cNF0GE%3D&loginPhrase=1574991374806spbcvsuwerl52tppx9dw5khuz8rew13mkq86gg8r2c`
      type: apiKey
      in: header
      name: zelidauth
