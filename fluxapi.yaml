  /daemon/getblockhashes:
    get:
      tags:
        - Daemon
      summary: Get block hashes
      description: Returns array of block hashes for given height range. **Public**
      operationId: getBlockHashes
      security: []
      parameters:
        - name: high
          in: query
          required: true
          schema:
            type: integer
          description: Ending block height
        - name: low
          in: query
          required: true
          schema:
            type: integer
          description: Starting block height
        - name: noOrphans
          in: query
          required: false
          schema:
            type: boolean
          description: Exclude orphan blocks. Note the camel-case spelling — FluxOS reads the `noOrphans` query parameter; the lower-case path segment of the route is not read.
          example: true
        - name: logicalTimes
          in: query
          required: false
          schema:
            type: boolean
          description: Include logical times. Note the camel-case spelling — FluxOS reads the `logicalTimes` query parameter; the lower-case path segment of the route is not read.
          example: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: array
                    items:
                      type: string
                      description: Block hash
              example:
                status: success
                data:
                  - '000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f'
                  - '00000000839a8e6886ab5951d76f411475428afc90947ee320161bbf18eb6048'
    post:
      tags:
        - Daemon
      summary: Get block hashes (POST)
      description: Returns array of block hashes for given height range. **Public**
      operationId: getBlockHashesPost
      security: []
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: object
              required:
                - high
                - low
              properties:
                high:
                  type: integer
                  description: Ending block height
                low:
                  type: integer
                  description: Starting block height
                options:
                  type: object
                  description: Passed to fluxd unchanged as the third argument
                  properties:
                    noOrphans:
                      type: boolean
                      description: Exclude orphan blocks
                    logicalTimes:
                      type: boolean
                      description: Include logical times
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: array
                    items:
                      type: string
