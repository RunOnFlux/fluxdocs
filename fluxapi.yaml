            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        alias:
                          type: string
                          description: Alias name
                        status:
                          type: string
                          description: Status of fluxnode
                        collateral:
                          type: string
                          description: Collateral txid and output index
                        txhash:
                          type: string
                          description: Transaction id
                        outputIndex:
                          type: integer
                          description: Output index
                        privateKey:
                          type: string
                          description: Fluxnode private key
                        address:
                          type: string
                          description: Ip address of fluxnode server and port
                        ip:
                          type: string
                          description: Ip address of fluxnode server
                        network:
                          type: string
                          description: 'Network type (IPv4, IPv6, onion)'
                        added_height:
                          type: integer
                          description: Block height fluxnode was added to list
                        confirmed_height:
                          type: integer
                          description: Block height fluxnode was confirmed by the network
                        last_confirmed_height:
                          type: integer
                          description: Latest block height network confirmed the fluxnode
                        last_paid_height:
                          type: integer
                          description: Block the fluxnode was last paid
                        tier:
                          type: string
                          description: Tier of fluxnode
                        payment_address:
                          type: string
                          description: Address where rewards are paid
                        activesince:
                          type: integer
                          description: Last paid time in epoch
                        lastpaid:
                          type: integer
                          description: Last paid time in epoch
              example:
                status: success
                data:
                  - alias: zn1
                    status: OFFLINE
                    collateral: >-
                      COutPoint(2bcd3c84c84f87eaa86e4e56834c92927a07f9e18718810b92e0d0324456a67c,
                      0)
                    txhash: >-
                      2bcd3c84c84f87eaa86e4e56834c92927a07f9e18718810b92e0d0324456a67c
                    outputIndex: 0
                    privateKey: 93HaYBVUCYjEMeeH1Y4sBGLALQZE1Yc1K64xiqgX37tGBDQL8Xg
                    address: '127.0.0.2:16125'
                    ip: UNKNOWN
                    network: UNKNOWN
                    added_height: 0
                    confirmed_height: 0
                    last_confirmed_height: 0
                    last_paid_height: 0
                    tier: UNKNOWN
                    payment_address: UNKNOWN
                    activesince: 0
                    lastpaid: 0
