                status: success
                data:
                  version: 6010050
                  protocolversion: 170018
                  walletversion: 60000
                  balance: 0
                  blocks: 1414803
                  timeoffset: 0
                  connections: 33
                  proxy: ''
                  difficulty: 32885.838697886431
