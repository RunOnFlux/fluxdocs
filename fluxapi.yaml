  /id/loggedusers:
    get:
      tags:
        - ID
      summary: Gets information about logged users
      description: >-
        This call gets basic infromation about currently logged sessions of all
        users. **Admin**
      operationId: loggedUsers
      security:
        - FluxID: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        zelid:
                          type: string
                          description: users FluxID
                        loginPhrase:
                          type: string
                          description: login phrase used for session
                        createdAt:
                          type: string
                          format: date-time
                          description: Session start
                        expireAt:
                          type: string
                          format: date-time
                          description: Session expiry
              example:
                status: success
                data:
                  - zelid: 1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC
                    loginPhrase: 1566749385160npvtiku0z7yqsxgenyvzfmfrz7pyxrxvflv3sfztbc
                  - zelid: 1E1NSwDHtvCziYP4CtgiDMcgvgZL64PhkR
                    loginPhrase: 1575805361736fdk6ak6yn5lgiuebz1oumh9z8rhyw0kf744f1sk2yd43
  /id/activeloginphrases:
    get:
      tags:
        - ID
      summary: Lists active login phrases
      description: >-
        This call lists the login phrases that are currently active: issued by
        `GET /id/loginphrase` or `GET /id/emergencyphrase` less than 15 minutes
        ago and not yet used. A phrase is removed when it is used to log in
        successfully. **Admin**
      operationId: activeLoginPhrases
      security:
        - FluxID: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        loginPhrase:
                          type: string
                          description: active login phrase
                        createdAt:
                          type: string
                          description: timestamp of loginPhrase creation in server time.
                        expireAt:
                          type: string
                          description: >-
                            expiration timestamp of loginPhrase. After this
                            time, the loginPhrase cannot be used anymore.
              example:
                status: success
                data:
                  - loginPhrase: 1575865221315yqilps02mx0e1tmf5ymtcry8mbzk4u3k3v17tdsxif6
                    createdAt: '2019-12-09T04:20:21.315Z'
                    expireAt: '2019-12-09T04:35:21.315Z'
                  - loginPhrase: 1575865221315yqilps02mx0e1tmf5ymtcry8mbzk4u3k3v17tdsxif6
                    createdAt: '2019-12-09T04:20:21.315Z'
                    expireAt: '2019-12-09T04:35:21.315Z'
  /id/logoutallusers:
    get:
      tags:
        - ID
      summary: Logs out all users
      description: >-
        This call logs out all logged users (including fluxteam, admins).
        **Admin**
      operationId: logoutAllUsers
      security:
        - FluxID: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: Successfully logged out all users
  /id/logoutspecificsession:
    post:
      tags:
        - Authentication
        - ID
      summary: Logs out a specific session
      security:
        - FluxID: []
      description: >-
        Logs out the session whose `loginPhrase` is sent in the body. Any
        logged-in FluxID may call it; the session is found by its login phrase
        alone, so knowing a session's login phrase is what allows logging it
        out. There is no separate admin path. **User**
      operationId: logoutSpecificSession
      requestBody:
        content:
          text/plain:
            schema:
              type: object
              properties:
                loginPhrase:
                  description: Login Phrase of session we want to log out.
                  type: string
                  minLength: 40
                  example: 1574991374806spbcvsuwerl52tppx9dw5khuz8rew13mkq86gg8r2c
            example:
              loginPhrase: 1575012988077darschvve5ag82g8e8sgeij4sn61842ya7ovxi9r3kba
        description: Object containing loginPhrase
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: Session successfully logged out
  /id/checkprivilege:
    post:
      tags:
        - ID
      summary: Checks the privilege level of user
      security: []
      description: >-
        Checks the privilege level of the session described in the body.
        Answers `success` with `message` `admin` (this node's operator),
        `fluxteam` or `user`, checked in that order, or `error` with `message`
        `none` when the session is not valid or a field is missing. **Public**
      operationId: checkLoggedUser
      requestBody:
        content:
          text/plain:
            schema:
              type: object
              required:
                - zelid
                - loginPhrase
                - signature
              properties:
                zelid:
                  type: string
                  description: FluxID
                loginPhrase:
                  type: string
                  description: Login phrase of the session
                signature:
                  type: string
                  description: Signature of signed loginPhrase with FluxID
            example:
              zelid: 1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC
              loginPhrase: 1575012988077darschvve5ag82g8e8sgeij4sn61842ya7ovxi9r3kba
              signature: IAMZBB0p8aQ6A0Zt8uUKFLdWvPJlBypuczhaM6/R+s5bI72NQs/TPF1KYywvJlumMZyvLmk7JelDwaQbfTjqtSs=
        description: Object containing privilege level
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: admin
  #Flux
  /flux/startdaemon:
    get:
      tags:
        - Flux
      summary: Starts Flux daemon
      description: >-
        Tries to start Flux daemon running on the Flux node the call is run
        against without any extra parameters. **AdminAndFluxTeam**
      operationId: startdaemon
      security:
        - FluxID: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: Daemon successfully started
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /flux/restartdaemon:
    get:
      tags:
        - Flux
      summary: Restarts Flux daemon
      description: >-
        Tries to restart Flux daemon running on the Flux node the call is run
        against. Flux daemon is firstly stopped and then started without any
        extra parameters. **AdminAndFluxTeam**
      operationId: restartdaemon
      security:
        - FluxID: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: Daemon successfully restarted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /flux/entermaster:
    get:
      tags:
        - Flux
      summary: Switch to master branch of FluxOS
      description: >-
        Tries to switch to master branch of FluxOS. **FluxTeam**
      operationId: FluxEnterMaster
      security:
        - FluxID: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: Master branch successfully entered
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /flux/enterdevelopment:
    get:
      tags:
        - Flux
      summary: Switch to development branch of FluxOS
      description: >-
        Tries to switch to development branch of FluxOS. **FluxTeam**
      operationId: FluxEnterDevelopment
      security:
        - FluxID: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: Development branch successfully entered
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /flux/reindexdaemon:
    get:
      tags:
        - Flux
      summary: Reindexes Flux daemon
      description: >-
        Tries to reindex Flux daemon running on the Flux node the call is run
        against. Flux daemon is firstly stopped and then started with reindex
        flag. **Admin**
      operationId: reindexFluxB
      security:
        - FluxID: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: Daemon successfully reindexing
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /flux/updateflux:
    get:
      tags:
        - Flux
      summary: Updates Flux to the latest version
      description: >-
        Updates Flux to the latest version available according to github
        master branch. Flux will restart its services after the update.
        **AdminAndFluxTeam**
      operationId: updateFlux
      security:
        - FluxID: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: Flux successfully updating
  /flux/hardupdateflux:
    get:
      tags:
        - Flux
      summary: Perform hard update to the latest version
      description: >-
        Hard updates to latest version by removing node_modules and
        package-lock.json before executing git reset --hard and git pull. This
        may resolve any issues that may arise from Flux not being able to
        update using the `GET /flux/updateflux` call. Flux will restart
        its services after the update. **AdminAndFluxTeam**
      operationId: hardUpdateFlux
      security:
        - FluxID: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: Flux successfully updating
  /flux/updatedaemon:
    get:
      tags:
        - Flux
      summary: Updates Flux daemon
      description: >-
        Updates the Flux daemon of Flux node to the latest available version
        according to official Flux APT repository. Flux daemon is restarted
        with no extra parameters during this update. **AdminAndFluxTeam**
      operationId: updateDaemon
      security:
        - FluxID: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: Daemon successfully updated
