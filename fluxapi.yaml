  /daemon/prioritisetransaction:
    get:
      tags:
        - Daemon
      summary: Priortise a transaction
      description: >-
        Accepts the transaction into mined blocks at a higher (or lower)
        priority. **User**
      operationId: prioritiseTransaction
      security:
        - FluxID: []
      parameters:
        - in: query
          name: txid
          required: true
          schema:
            type: string
          description: The transaction id
          example: 22ab3d049154c7d4b0f04b381770c655564facdc896a4f7e97aa5662f57a58c6
        - in: query
          name: prioritydelta
          required: true
          schema:
            type: integer
          description: >-
            The priority to add or subtract. The transaction selection algorithm
            considers the tx as it would have a higher priority. (priority of a
            transaction is calculated: coinage * value_in_satoshis / txsize)
          example: 0
        - in: query
          name: feedelta
          required: true
          schema:
            type: integer
          description: >-
            The fee value (in satoshis) to add (or subtract, if negative). The
            fee is not actually paid, only the algorithm for selecting
            transactions into a block considers the transaction as it would have
            paid a higher (or lower) fee.
          example: 10000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: boolean
                    description: Returns true
              example:
                status: success
                data: true
  /daemon/reindex:
    get:
      tags:
        - Daemon
      summary: Reindex Flux daemon
      description: >-
        Tries to reindex Flux daemon running on the FluxNode the call is run
        against. Flux daemon is firstly stopped and then started with reindex
        flag. **Admin**
      operationId: reindexFlux
      security:
        - FluxID: []
      responses:
        '200':
          description: OK
          content:
            application/json:
