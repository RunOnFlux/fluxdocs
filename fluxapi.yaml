  - name: Authentication
    description: >-
      **Authentication & Authorization Endpoints**
      
      Essential API endpoints for secure authentication and authorization with the Flux network. 
      These endpoints handle login phrase generation, message signing verification, and session 
      management for all supported wallet types including SSP Wallet, ZelCore, MetaMask, and 
      WalletConnect integrations.
      
      **Key Features:**
      - Multi-wallet authentication support
      - Secure login phrase generation
      - Cryptographic signature verification 
      - Session token management
      - 5-tier permission system integration
      
