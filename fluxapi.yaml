  /daemon/getblockcount:
    get:
      tags:
        - Daemon
      summary: Current block count
      description: Returns the number of blocks in the best valid block chain, i.e. the current block height. **Public**
      operationId: getBlockCount
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: integer
                    description: Block count
              example:
                status: success
                data: 1410823
