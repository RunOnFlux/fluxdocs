servers:
  - url: 'https://api.runonflux.io'
    description: >-
      Production API Gateway - global load-balanced endpoint. Requests are served
      by whichever confirmed FluxNode the gateway routes to, so node-scoped
      endpoints (anything that reports or changes the state of one machine)
      should be called against a specific node instead.
  - url: 'https://{nodeip}:16127'
    description: 'Direct Flux Node Connection - Connect directly to specific node'
    variables:
      nodeip:
        description: 'Flux node IP address or hostname'
        default: 'localhost'
  - url: 'http://localhost:16127'
    description: 'Local Development Node - For local testing'
  - url: 'https://explorer.runonflux.io'
    description: 'Explorer API - Blockchain data and statistics'
  - url: 'https://stats.runonflux.io'
    description: 'Network Statistics API - Real-time network metrics'
paths:
  #ID
  /id/loginphrase:
    get:
      tags:
        - Authentication
        - ID
      summary: Obtain login phrase
      description: >-
        Obtain valid Login Phrase for signing into Flux. Login Phrase is at
        least 40 characters, first 13 characters is server timestamp and is
        valid for 15 minutes.


        A phrase is issued only to a node that passes the same fitness checks
        as `GET /flux/health`, run in this order: local database, Syncthing,
        Docker, tier hardware, DOS state, applications DOS state. The first
        failing check is answered instead of a phrase as an error body; a DOS
        failure carries `name` `DOS` or `CONNERROR` and the DOS score as
        `code`. Since 8.19.0 the Syncthing check refuses only a node whose
        Syncthing FluxOS supervises (a local Syncthing on a node that is not
        ArcaneOS), and only once Syncthing has been measured unhealthy; a node
        that has not yet measured it is not refused. `GET /id/emergencyphrase`
        issues a phrase without these checks. **Public**
      operationId: loginPhrase
      security: []
      x-codeSamples:
        - lang: 'curl'
          source: |
            curl -X GET "https://api.runonflux.io/id/loginphrase"
        - lang: 'JavaScript'
          source: |
            const response = await fetch('https://api.runonflux.io/id/loginphrase');
            const data = await response.json();
            console.log(data.data); // Login phrase string
        - lang: 'Node.js'
          source: |
            const https = require('https');
            
            const options = {
              hostname: 'api.runonflux.io',
              path: '/id/loginphrase',
              method: 'GET'
            };
            
            const req = https.request(options, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                const result = JSON.parse(data);
                console.log(result.data);
              });
            });
            req.end();
        - lang: 'Python'
          source: |
            import requests
            
            response = requests.get('https://api.runonflux.io/id/loginphrase')
            data = response.json()
            login_phrase = data['data']
            print(login_phrase)
        - lang: 'PHP'
          source: |
            <?php
            $response = file_get_contents('https://api.runonflux.io/id/loginphrase');
            $data = json_decode($response, true);
            $loginPhrase = $data['data'];
            echo $loginPhrase;
            ?>
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: string
                    description: loginphrase
              example:
                status: success
                data: 1574994809615gj4ct52kzz695twl0l27np0ivkmvu2ow4lbtpwk2nvf2k
  /id/emergencyphrase:
    get:
      tags:
        - ID
      summary: Obtain emergency login phrase
      description: >-
        Obtain an emergency Login Phrase for signing into Flux, issued without
        the node-fitness checks of `GET /id/loginphrase`. Valid for 15 minutes.
        **Public**
      operationId: emergencyLoginPhrase
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: string
                    description: loginphrase
              example:
                status: success
                data: 1587939091067l06vdyv5wtl80q5aj0npi3vyyig869ogf7o7jxfpu68r
  /id/verifylogin:
    post:
      tags:
        - Authentication
        - ID
      summary: Login into Flux
      description: >-
        Login into Flux by submitting correct FluxID, login phrase and
        signature. Note that to get the signature of the signed message you
        would need to do the signing on Zelcore or your BTC wallet or your ETH wallet. If success
        status response is returned, we can use the supplied data(zelid,
        loginPhrase, signature) as zelidauth header as part of api calls that
        require a user to be logged in. Additionally it is possible to listen
        for a response on websocket.
        ws://{Flux_IP}:16127/ws/id/{loginPhrase}. **Public**
      operationId: verifyLogin
      security: []
      x-codeSamples:
        - lang: 'curl'
          source: |
            curl -X POST "https://api.runonflux.io/id/verifylogin" \
              -H "Content-Type: text/plain" \
              -d '{
                "zelid": "1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC",
                "loginPhrase": "1574994809615gj4ct52kzz695twl0l27np0ivkmvu2ow4lbtpwk2nvf2k",
                "signature": "IAMZBB0p8aQ6A0Zt8uUKFLdWvPJlBypuczhaM6/R+s5bI72NQs/TPF1KYywvJlumMZyvLmk7JelDwaQbfTjqtSs="
              }'
        - lang: 'JavaScript'
          source: |
            const loginData = {
              zelid: "1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC",
              loginPhrase: "1574994809615gj4ct52kzz695twl0l27np0ivkmvu2ow4lbtpwk2nvf2k", 
              signature: "IAMZBB0p8aQ6A0Zt8uUKFLdWvPJlBypuczhaM6/R+s5bI72NQs/TPF1KYywvJlumMZyvLmk7JelDwaQbfTjqtSs="
            };
            
            const response = await fetch('https://api.runonflux.io/id/verifylogin', {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify(loginData)
            });
            
            const result = await response.json();
            console.log(result);
        - lang: 'Python'
          source: |
            import requests
            import json
            
            login_data = {
                "zelid": "1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC",
                "loginPhrase": "1574994809615gj4ct52kzz695twl0l27np0ivkmvu2ow4lbtpwk2nvf2k",
                "signature": "IAMZBB0p8aQ6A0Zt8uUKFLdWvPJlBypuczhaM6/R+s5bI72NQs/TPF1KYywvJlumMZyvLmk7JelDwaQbfTjqtSs="
            }
            
            response = requests.post(
                'https://api.runonflux.io/id/verifylogin',
                headers={'Content-Type': 'text/plain'},
                data=json.dumps(login_data)
            )
            
            result = response.json()
            print(result)
      requestBody:
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/FluxIDLogin'
            example:
              loginPhrase: 1575012988077darschvve5ag82g8e8sgeij4sn61842ya7ovxi9r3kba
              zelid: 1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC
              signature: IAMZBB0p8aQ6A0Zt8uUKFLdWvPJlBypuczhaM6/R+s5bI72NQs/TPF1KYywvJlumMZyvLmk7JelDwaQbfTjqtSs=
        description: FluxID login object
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                    enum:
                      - success
                      - error
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        description: explanation of status
                      zelid:
                        type: string
                        description: supplied FluxID or bitcoin P2PKH address or ethereum address
                      loginPhrase:
                        type: string
                        description: valid and active loginPhrase
                      signature:
                        type: string
                        description: signature of loginPhrase signed with zelid/btc/eth address
                      privilage:
                        type: string
                        description: >-
                          Granted Flux privilege. The field is spelled
                          `privilage` on the wire.
                        enum:
                          - user
                          - fluxteam
                          - admin
                      createdAt:
                        type: string
                        format: date-time
                        description: Session start (the login phrase timestamp)
                      expireAt:
                        type: string
                        format: date-time
                        description: Session expiry, 14 days after createdAt
              example:
                status: success
                data:
                  message: Successfully logged in
                  zelid: 1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC
                  loginPhrase: 1575012988077darschvve5ag82g8e8sgeij4sn61842ya7ovxi9r3kba
                  signature: >-
                    IAMZBB0p8aQ6A0Zt8uUKFLdWvPJlBypuczhaM6/R+s5bI72NQs/TPF1KYywvJlumMZyvLmk7JelDwaQbfTjqtSs=
                  privilage: admin
                  createdAt: '2019-11-29T07:36:28.077Z'
                  expireAt: '2019-12-13T07:36:28.077Z'
  /id/providesign:
    post:
      tags:
        - Authentication
        - ID
      summary: Provide Signature
      description: >-
        Provide requested signature from signed message to return data.
        **Public**
      operationId: provideSign
      security: []
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: FluxID or any P2PKH Bitcoin address or Ethereum address
                message:
                  type: string
                  description: >-
                    Login phrase message that was provided by GET
                    /id/loginphrase
                signature:
                  type: string
                  description: Signature of signed loginPhrase with zelid/btc/eth address
            example:
              address: 1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC
              message: 1575012988077darschvve5ag82g8e8sgeij4sn61842ya7ovxi9r3kba
              signature: >-
                IAMZBB0p8aQ6A0Zt8uUKFLdWvPJlBypuczhaM6/R+s5bI72NQs/TPF1KYywvJlumMZyvLmk7JelDwaQbfTjqtSs=
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      signature:
                        type: string
                        description: Signature of signed loginPhrase with FluxID
                      identifier:
                        type: string
                        description: FluxID, P2PKH or Ethereum address followed by the last 13 characters of the signed message
                      createdAt:
                        type: string
                        description: Start date and time of vaild message
                      expireAt:
                        type: string
                        description: End date and and time of valid message
                      _id:
                        type: string
                        description: ObjectID
              example:
                status: success
                data:
                  signature: >-
                    IAMZBB0p8aQ6A0Zt8uUKFLdWvPJlBypuczhaM6/R+s5bI72NQs/TPF1KYywvJlumMZyvLmk7JelDwaQbfTjqtSs=
                  identifier: 1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uCya7ovxi9r3kba
                  createdAt: '2020-09-12T11:28:28.457Z'
                  expireAt: '2020-09-12T11:43:28.457Z'
                  _id: 5f6cb0bcb7e30e24063e1777
  /id/loggedsessions:
    get:
      tags:
        - ID
      summary: Obtain all logged sessions of FluxID.
      description: >-
        Gets all currently active logged sessions in Flux tied to given
        FluxID. **User**
      operationId: loggedSessions
      security:
        - FluxID: []
      x-codeSamples:
        - lang: 'curl'
          source: |
            curl -X GET "https://api.runonflux.io/id/loggedsessions" \
              -H "zelidauth: zelid=1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC&signature=IAMZBB0p8aQ6A0Zt8uUKFLdWvPJlBypuczhaM6%2FR%2Bs5bI72NQs%2FTPF1KYywvJlumMZyvLmk7JelDwaQbfTjqtSs%3D&loginPhrase=1574994809615gj4ct52kzz695twl0l27np0ivkmvu2ow4lbtpwk2nvf2k"
        - lang: 'JavaScript'
          source: |
            const authHeader = 'zelid=1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC&signature=' + 
              encodeURIComponent('IAMZBB0p8aQ6A0Zt8uUKFLdWvPJlBypuczhaM6/R+s5bI72NQs/TPF1KYywvJlumMZyvLmk7JelDwaQbfTjqtSs=') +
              '&loginPhrase=1574994809615gj4ct52kzz695twl0l27np0ivkmvu2ow4lbtpwk2nvf2k';
            
            const response = await fetch('https://api.runonflux.io/id/loggedsessions', {
              headers: { 'zelidauth': authHeader }
            });
            
            const result = await response.json();
            console.log(result);
        - lang: 'Python'
          source: |
            import requests
            from urllib.parse import quote
            
            auth_header = (
                f"zelid=1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC&"
                f"signature={quote('IAMZBB0p8aQ6A0Zt8uUKFLdWvPJlBypuczhaM6/R+s5bI72NQs/TPF1KYywvJlumMZyvLmk7JelDwaQbfTjqtSs=')}&"
                f"loginPhrase=1574994809615gj4ct52kzz695twl0l27np0ivkmvu2ow4lbtpwk2nvf2k"
            )
            
            response = requests.get(
                'https://api.runonflux.io/id/loggedsessions',
                headers={'zelidauth': auth_header}
            )
            
            result = response.json()
            print(result)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        zelid:
                          type: string
                          description: associated FluxID
                        loginPhrase:
                          type: string
                          description: login phrase used for session
                        createdAt:
                          type: string
                          format: date-time
                          description: Session start
                        expireAt:
                          type: string
                          format: date-time
                          description: Session expiry
              example:
                status: success
                data:
                  - zelid: 1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC
                    loginPhrase: 1566749385160npvtiku0z7yqsxgenyvzfmfrz7pyxrxvflv3sfztbc
                  - zelid: 1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC
                    loginPhrase: 1566822581693fuuo3oi0sqdvab9h8baavc0kdawxvbwjgdbjsy5tk739m
                  - zelid: 1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC
                    loginPhrase: 1566970790344nhd5tjwyphq4l1azf5o64axfz75b8892poo853ivbfc
                  - zelid: 1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC
