  /apps/applogpolling/{appname}:
    get:
      tags:
        - Apps
      summary: Poll application logs
      description: Poll application logs with real-time updates. **AppOwnerAbove**
      operationId: appLogPolling
      security:
        - FluxID: []
      parameters:
        - name: appname
          in: path
          required: true
          schema:
            type: string
          description: Name of the application
          example: electrumxtest
        - name: since
          in: query
          required: false
          schema:
            type: string
          description: Only lines after this time (anything Date.parse accepts); ignored when `cursor` is sent.
        - in: query
          name: lineCount
          required: false
          schema:
            type: string
            default: all
          description: Most recent lines to return, or `all` (default `all`).
          example: '100'
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: Opaque cursor from a previous response; resumes where that poll stopped
          example: eyJwb3MiOjQyfQ
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Not wrapped in `data` — the fields sit beside `status`.
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  logs:
                    type: array
                    items:
                      type: string
                  lineCount:
                    description: The line limit applied (`all` or a number)
                  logCount:
                    type: integer
                  sinceTimestamp:
                    type: string
                  cursor:
                    type: string
                    nullable: true
                    description: Position reached; send it back as `cursor` to receive only newer lines
                  rolledOver:
                    type: boolean
                    description: The line the cursor pointed at was rotated away by Docker; lines in between are lost
                  skipped:
                    type: boolean
                    description: The cursor was further back than one read reaches; it was moved forward and the lines in between were not delivered
                  truncated:
                    type: boolean
                    description: The log holds more than the line limit (reported only when no cursor was sent)
              example:
                status: success
                logs:
                  - '2026-10-01T10:00:00.000000000Z Application started'
                lineCount: 100
                logCount: 1
                sinceTimestamp: ''
                cursor: eyJwb3MiOjQyfQ
                rolledOver: false
                skipped: false
                truncated: true
