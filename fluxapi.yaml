components:
  schemas:
    operation:
      type: object
      description: The state of a long-running operation, as served by GET /apps/operations/{jobId}.
      properties:
        jobId:
          type: string
          description: Operation id, of the form `op_<uuid>`
        kind:
          type: string
          description: What the operation is doing, e.g. `fileoperation.copy`
        status:
          type: string
          description: >-
            `Running`, or one of the terminal states. `Evicted` means the node
            took the work away — distinct from `Canceled`, which the caller asked
            for, and from `Failed`, where the caller's input was at fault.
          enum:
            - Running
            - Succeeded
            - Failed
            - Canceled
            - Evicted
        createdAt:
          type: integer
          description: Unix milliseconds
        lastUpdatedAt:
          type: integer
          description: Unix milliseconds
        progress:
          type: array
          description: Line-numbered progress output; use `sinceSeq` to read only what is new
          items:
            type: string
        error:
          nullable: true
          type: object
          description: >-
            An RFC 9457 problem object when the operation failed, otherwise null.
            Registry credentials are scrubbed from `detail`.
          properties:
            type:
              type: string
            title:
              type: string
            status:
              type: integer
            detail:
              type: string
            instance:
              type: string
            code:
              type: string
            retryAfterMs:
              type: integer
        detail:
          nullable: true
          type: object
          description: Operation-specific detail, built at read time
    volumeObjectOperation:
      type: object
      description: >-
        Operands for a file operation inside an application's persistent volume.
        Each field may also be sent as a query parameter.
      required:
        - appname
        - component
        - source
        - destination
      properties:
        appname:
          type: string
          description: Application name
        component:
          type: string
          description: Component name; `null` for a pre-v4 (single-component) application
        source:
          oneOf:
            - type: string
            - type: array
              minItems: 1
              maxItems: 1000
              items:
                type: string
          description: >-
            Path relative to the volume root. `POST /apps/compressobject` also
            accepts a list of up to 1000 paths; the other operations take one.
        destination:
          type: string
          description: Path relative to the volume root
        overwrite:
          type: boolean
          description: >-
            Replace an existing destination. `false` by default, in which case an
            occupied destination is refused.
          default: false
    placementAdvice:
      type: object
      description: The answer of POST /apps/placementfeasibility.
      properties:
        instances:
          type: integer
          description: The instance count the answer was computed for
        candidateCount:
          type: integer
          description: Eligible nodes for the spec's geolocation and tier requirements
        domainCount:
          type: integer
