                        last_confirmed_height:
                          type: integer
                          description: Latest block height network confirmed the FluxNode
                        last_paid_height:
                          type: integer
                          description: Block the FluxNode was last paid
                        tier:
                          type: string
                          description: Tier of FluxNode
                        payment_address:
                          type: string
                          description: Address where rewards are paid
                        pubkey:
                          type: string
                          description: Fluxnode public key used for message broadcasting
                        activesince:
                          type: string
                          description: Active time of FluxNode in epoch
                        lastpaid:
                          type: string
