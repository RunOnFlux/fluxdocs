  /apps/listrunningapps:
    get:
      tags:
        - Apps
      summary: list running apps
      description: >-
        List of running app containers, each as `Names`, `State` and `Status`
        only. Also lists stopped containers of an app whose backup or restore is
        in progress. **Public**
      operationId: listRunningApps
      security: []
      x-codeSamples:
        - lang: 'curl'
          source: |
            curl -X GET "https://api.runonflux.io/apps/listrunningapps"
        - lang: 'JavaScript'
          source: |
            const response = await fetch('https://api.runonflux.io/apps/listrunningapps');
            const apps = await response.json();
            
            // Display running apps
            apps.data.forEach(app => {
              console.log(`App: ${app.Names[0]} - Status: ${app.State}`);
            });
        - lang: 'Python'
          source: |
            import requests
            
            response = requests.get('https://api.runonflux.io/apps/listrunningapps')
            apps_data = response.json()
            
            for app in apps_data['data']:
                print(f"App: {app['Names'][0]} - Status: {app['State']}")
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        Names:
                          type: array
                          items:
                            type: string
                          description: Docker's container names, verbatim (e.g. `/fluxmycomponent_myapp`)
                        State:
                          type: string
                          description: Docker's container state
                        Status:
                          type: string
                          description: Docker's human-readable status
              example:
                status: success
                data:
                  - Names:
                      - /fluxFoldingAtHome
                    State: running
                    Status: Up 5 days
