            type: string
            enum:
              - add
              - remove
              - onetry
          description: |
            Use 'add' to add a node to the list, 'remove' to remove a node from
            the list, 'onetry' to try a connection to the node once.

            Example:
            - `node`=`<ip:port>`&`command`=`add`
      responses:
        '200':
          description: OK
