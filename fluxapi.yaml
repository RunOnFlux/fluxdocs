  /apps/appspecifications/{appname}:
    get:
      tags:
        - Apps
      summary: Global app specs of app specified
      description: >-
        Returns the specifications of the queried application.


        For an **enterprise application** (specification version 8 or above with
        `enterprise` set) the `compose` and `contacts` fields are always
        returned empty. With `decrypt`, which requires the application owner's
        authentication and an `enterprise-key` header, the owner receives
        `enterprise` re-encrypted to the session key from that header. Refused
        while the daemon is not synced.
        **Public** (decrypted view: **AppOwner**)
      operationId: getApplicationSpecificationAPI
      security: []
      parameters:
        - in: path
          name: appname
          required: true
          schema:
            type: string
          description: Application name
          example: mexcdnxbot
        - in: query
          name: decrypt
          required: false
          schema:
            type: string
          description: >-
            Any non-empty value requests the owner view of an enterprise
            application (decrypt=false requests it too — omit the parameter for
            the public view). Also accepted as a second path segment.
          example: 'true'
        - in: header
          name: enterprise-key
          required: false
          schema:
            type: string
          description: Required with `decrypt` — the session key the returned `enterprise` field is encrypted to.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/appname'
              example:
                status: success
                data:
                  name: mexcdnxbot
                  compose:
                    - name: mexcdnxbot
                      description: DNX trading bot
                      repotag: botinflux/mexc-dnx-bot:latest
                      ports: []
                      domains: []
                      environmentParameters:
                        - F_S_ENV=https://storage.runonflux.io/v1/env/920423489107913
                      commands: []
                      containerPorts: []
                      containerData: /tmp
                      cpu: 1
                      ram: 1000
                      hdd: 5
                      tiered: false
                      secrets: ''
                      repoauth: ''
                  contacts:
                    - F_S_CONTACTS=https://storage.runonflux.io/v1/contacts/375596725336268
                  description: DNX trading bot
                  expire: 22000
                  geolocation:
                    - a!cAS_ID_NONE
                  hash: b9f3040c63ba8820acddcff5e503e8047a5c603ed734bb9bac953dcdc04ee33c
                  height: 1452806
                  instances: 3
                  nodes: []
                  owner: 1DSBszWHPNs4MXwRdtV7wDLKDXRefzVYVi
                  staticip: false
                  version: 7
