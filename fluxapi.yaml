  /daemon/validateaddress:
    get:
      tags:
        - Daemon
      summary: Info of the Flux address
      description: >-
        Return information about the given Flux address.


        The `ismine` and `iswatchonly` fields are **redacted for unauthenticated
        callers** — they describe this node's wallet, so a node-operator
        `zelidauth` header is required to receive them. **Public**
      operationId: validateAddress
      security: []
      parameters:
        - in: query
          name: fluxaddress
          required: true
          schema:
            type: string
          description: Flux address to validate
          example: t1N6mLX2A64QsyuLbYkfPZSrkLF86hxuuFe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      isvalid:
                        type: boolean
                        description: >-
                          If the address is valid or not. If not, this is the
                          only property returned.
                      address:
                        type: string
                        description: The Flux address validated
                      scriptPubKey:
                        type: string
                        description: The hex encoded scriptPubKey generated by the address
                      ismine:
                        type: boolean
                        description: If the address is yours or not
                      iswatchonly:
                        type: boolean
                        description: If address is watch only
                      isscript:
                        type: boolean
                        description: If the key is a script
                      pubkey:
                        type: string
                        description: The hex value of the raw public key
                      iscompressed:
                        type: boolean
                        description: If the address is compressed
                      account:
                        type: string
                        description: >-
                          DEPRECATED. The account associated with the address,
                          "" is the default account
              example:
                status: success
                data:
                  isvalid: true
                  address: t1N6mLX2A64QsyuLbYkfPZSrkLF86hxuuFe
                  scriptPubKey: 76a9142e5db3157a9783c6208019323f2c3a02610826a988ac
                  ismine: true
                  iswatchonly: false
                  isscript: false
                  pubkey: >-
                    036b6a136ce869a0b400548a9126f06d96181ee974ff1c7f5a5e54e39b7f66be05
                  iscompressed: true
                  account: ''
  /daemon/verifymessage:
    post:
      tags:
        - Daemon
      summary: Verify a message
      description: Verify a signed message. **Public**
      operationId: verifyMessagePost
      security: []
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: object
              properties:
                fluxaddress:
                  type: string
                  description: The Flux address to use for the signature
                signature:
                  type: string
                  description: The signature provided by the signer in base 64 encoding
                message:
                  type: string
                  description: The message that was signed
            example:
              fluxaddress: t1N6mLX2A64QsyuLbYkfPZSrkLF86hxuuFe
              signature: >-
                H5j8AoJ+8VaEEJGgw846hSPQoq42X9yiLwn/Nab1pASBFcw8rj5k8J9xpKr1VzepMEOF2ProYxVsQ9i7xalH4Sk=
              message: helloworld
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: boolean
                    description: If the signature is verified or not.
              example:
                status: success
                data: true
    get:
      tags:
        - Daemon
      summary: Verify a message
      description: Verify a signed message. **Public**
      operationId: verifyMessage
      security: []
      parameters:
        - in: query
          name: fluxaddress
          required: true
          schema:
            type: string
          description: The Flux address to use for the signature
          example: t1N6mLX2A64QsyuLbYkfPZSrkLF86hxuuFe
        - in: query
          name: signature
          required: true
          schema:
            type: string
          description: The signature provided by the signer in base 64 encoding
          example: >-
            H5j8AoJ+8VaEEJGgw846hSPQoq42X9yiLwn/Nab1pASBFcw8rj5k8J9xpKr1VzepMEOF2ProYxVsQ9i7xalH4Sk=
        - in: query
          name: message
          required: true
          schema:
            type: string
          description: The message that was signed
          example: helloworld
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: boolean
                    description: If the signature is verified or not.
              example:
                status: success
                data: true
