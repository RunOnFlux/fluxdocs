  /flux/streamchainpreparation:
    get:
      tags:
        - Flux
      summary: Stream chain preparation
      description: >-
        Prepares this node to stream its blockchain: checks that the local
        daemon is synced (tip no older than 10 minutes) and that the node is not
        within 30 blocks of its confirmation window, then stops the daemon and
        watchdog. If no `POST /flux/streamchain` starts within 30 seconds they
        are started again. **Reachable only from the node's own local network**
        (a private RFC 1918 address) — the caller is identified by its socket
        address, so no `zelidauth` header is required. Refusals carry the reason
        in the HTTP status text: `403` for a caller outside the private network,
        `422` when streaming is disabled for failing the minimum throughput
        criteria, and `503` while another stream is already in progress, when
        the daemon is not synced or cannot be queried, when the node is outside
        its maintenance window, or when a service could not be stopped.
        **Public** (local network only)
      operationId: streamChainPreparation
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: Daemon stopped, you can start stream chain functionality
        '403':
          description: Caller is not on a private (RFC 1918) address
        '422':
          description: Streaming disabled after failing the minimum throughput criteria
        '503':
          description: >-
            Another stream is in progress, the daemon is not synced or cannot be
            queried, the node is outside its maintenance window, or a service
            could not be stopped
  /flux/streamchain:
    post:
      tags:
        - Flux
      summary: Stream blockchain data
      description: >-
        Streams this node's blockchain data to another node on the same local
        network. Call `GET /flux/streamchainpreparation` first so the daemon is
        stopped. **Reachable only from the node's own local network** — the
        caller is identified by its socket address, so no `zelidauth` header is
        required. **Public** (local network only)
      operationId: streamChain
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                unsafe:
                  type: boolean
                  default: false
                  description: >-
                    Stream even though the daemon is still running (the copy may
                    be inconsistent); refused together with `compress`
                compress:
                  type: boolean
                  default: false
                  description: Gzip the tar stream on the fly (10-20x slower)
            example:
              compress: false
      responses:
        '200':
          description: >-
            The daemon's `determ_zelnodes`, `chainstate` and `blocks` folders as
            a tar stream (gzip when `compress` is set). A stream slower than
            200 Mbps after 35 seconds is cut and further streams are disabled.
          headers:
            Approx-Content-Length:
              description: Estimated size of the stream in bytes
              schema:
                type: integer
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        '403':
          description: Caller is not on a private (RFC 1918) address
        '422':
          description: Streaming disabled after failing the throughput criteria, or `unsafe` with `compress`
        '500':
          description: Chain folders not found
        '503':
          description: Another stream is in progress, or the daemon is still running (without `unsafe`)
  /flux/checkappavailability:
    post:
      tags:
        - Flux
      summary: Check application port availability
      description: >-
        Asks this node to test whether application ports are reachable on the
        caller's address. Used between Fluxnodes: the ask must be signed by a
        Fluxnode on the deterministic list (`pubKey`, and `signature` over the
        JSON of the body without `signature`). The address tested is the
        caller's own socket address; only the Flux team, which may skip the
        signature by sending a `zelidauth` header, may name another with `ip`.


        Up to 50 ports are tested in sequence; ports outside the application
        range or banned on Flux are skipped, and the first port that does not
        answer fails the check. With `echo: true` each port is read rather than
        just connected to, and `data.answered` returns the first 256 bytes each
        answered with.


        The handler reads the raw request stream: send the JSON as
        `text/plain`. With `Content-Type: application/json` the request never
        answers. **FluxTeam** (or a signed Fluxnode request)
      operationId: checkAppAvailability
      security:
        - FluxID: []
        - {}
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: object
              required:
                - ports
              properties:
                ports:
                  type: array
                  maxItems: 50
                  items:
                    type: integer
                  description: Application ports to test
                port:
                  type: integer
                  description: The asking node's API port; only echoed in the answer message
                ip:
                  type: string
                  description: >-
                    Address to test. Honoured for the Flux team only; every other
                    caller is tested on its own socket address
                echo:
                  type: boolean
                  description: Read each port and return what it answered, in `data.answered`
                pubKey:
                  type: string
                  description: Public key of the asking Fluxnode
                signature:
                  type: string
                  description: The Fluxnode's signature over the JSON of this body without `signature`
            example:
              ports:
                - 31350
                - 31351
              port: 16127
              echo: true
              pubKey: 04a1f3d...
              signature: H+ZB3oSrsw6XkBxxlbwk33LEBJ...
      responses:
        '200':
          description: >-
            OK. A failed check is also HTTP 200, as an error envelope:
            `Unable to verify request authenticity`, `No ports to test`,
            `Too many ports to test. Maximum of 50 allowed.`, or
            `Flux Applications on <ip>:<port> are not available. Failed port: <port>`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      answered:
                        type: object
                        additionalProperties:
                          type: string
                        description: Only with `echo`; port to the first bytes it answered with
              example:
                status: success
                data:
                  message: Flux Applications on 202.61.234.13:16127 are available.
                  answered:
                    '31350': "HTTP/1.1 200 OK\r\n..."
  /flux/keepupnpportsopen:
    post:
      tags:
        - Flux
      summary: Keep UPnP port mappings alive
      description: >-
        Asks this node to poke the caller's ports so the caller's router keeps
        its UPnP mappings open. The ask must be signed by a Fluxnode on the
        deterministic list (`pubKey`, and `signature` over the JSON of the body
        without `signature`) and carry a `timestamp` no more than 10 minutes
        old. The address poked is the caller's own socket address; only the
        Flux team, which may skip the signature by sending a `zelidauth`
        header, may name another with `ip`.


        This node first checks it can reach
        `http://<address>:<apiPort>/flux/uptime` within 3 seconds, then answers
        `202` and opens a TCP connection to, and sends one UDP datagram to, each
        port in turn. Every answer has an empty body. **FluxTeam** (or a signed
        Fluxnode request)
      operationId: keepUPNPPortsOpen
      security:
        - FluxID: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - apiPort
                - ports
                - timestamp
              properties:
                apiPort:
                  type: integer
                  description: The caller's API port, checked for reachability first
                ports:
                  type: array
                  maxItems: 10004
                  items:
                    type: integer
                  description: Ports to poke on the caller's address
                timestamp:
                  type: integer
                  description: Unix seconds; refused when more than 600 seconds old
                ip:
                  type: string
                  description: >-
                    Address to poke. Honoured for the Flux team only; every other
                    caller is poked on its own socket address
                pubKey:
                  type: string
                signature:
                  type: string
            example:
              apiPort: 16127
              ports:
                - 16126
                - 16122
                - 16128
                - 16129
                - 31350
              timestamp: 1772719200
              pubKey: 04a1f3d...
              signature: H+ZB3oSrsw6XkBxxlbwk33LEBJ...
      responses:
        '202':
          description: Accepted; the ports are poked after the response. Empty body.
        '401':
          description: Not signed by a listed Fluxnode, and not the Flux team. Empty body.
        '422':
          description: Missing or stale `timestamp`, missing `apiPort`, or `ports` not an array of at most 10,004 integers. Empty body.
        '503':
          description: The caller's API port could not be reached back. Empty body.
