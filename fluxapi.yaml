  /daemon/createrawtransaction:
    get:
      tags:
        - Daemon
      summary: Create raw transaction (GET)
      description: >-
        Creates an unsigned raw transaction (fluxd `createrawtransaction`) from
        the query string. `transactions` and `addresses` are JSON strings;
        `locktime` defaults to 0 and `expiryheight` to the current block count
        + 20. **Public**
      operationId: createRawTransaction
      security: []
      parameters:
        - name: transactions
          in: query
          required: true
          schema:
            type: string
          description: JSON string of transaction inputs
        - name: addresses
          in: query
          required: true
          schema:
            type: string
          description: JSON string of output addresses and amounts
        - name: locktime
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Transaction locktime
        - name: expiryheight
          in: query
          required: false
          schema:
            type: integer
          description: Transaction expiry height
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: string
                    description: Raw transaction hex
    post:
      tags:
        - Daemon
      summary: Create hex-encoded raw transaction
      description: >-
        Create a transaction spending the given inputs and sending to the given
        addresses. Returns hex-encoded raw transaction. Note that the
        transaction's inputs are not signed, and it is not stored in the wallet
        or transmitted to the network. **Public**
      operationId: createRawTransactionPost
      security: []
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: object
              properties:
                transactions:
                  type: array
                  items:
                    type: object
                    description: Objects pertaining to the transaction
                    properties:
                      txid:
                        type: string
                        description: The transaction id
                      vout:
                        type: integer
                        description: The output index
                      sequence:
                        type: integer
                        description: Sequence number (optional)
                addresses:
                  type: object
                  description: Object with addresses as keys and amounts as values
                locktime:
                  type: integer
                  default: 0
                  description: >-
                    Raw locktime. Non-0 value also locktime-activates inputs.
                    (optional)
                expiryheight:
                  type: integer
                  description: Expiry height of transaction (optional; defaults to the current block count + 20)
            example:
              transactions:
                - txid: >-
                    224225b04fd54e8653e7cd4440dd4596aab6eff8be8686bacfad9213172da4369f
                  vout: 0
              addresses:
                t1JKRwXGfKTGfPV1z48rvoLyabk31z3xwHa: 112.5
              locktime: 10
              expiryheight: 595000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: string
                    description: Hex string of the transaction
              example:
                status: success
                data: >-
                  0400008085202f89019f36a42d171392adcfba8686bef8efb6aa9645dd4044cde753864ed54fb025420000000000feffffff0180608d9e020000001976a91404e2699cec5f44280540fb752c7660aa3ba857cc88ac01000000fb0809000000000000000000000000
