  /daemon/getinfo:
    get:
      tags:
        - Daemon
      summary: Flux daemon info
      description: >-
        Returns an object containing various state info for the Flux daemon.


        The `balance` field is **redacted for unauthenticated callers** — send a
        node-operator `zelidauth` header to receive it. Everything else is
        public. **Public**
      operationId: getInfo
      security: []
      x-codeSamples:
        - lang: 'curl'
          source: |
            curl -X GET "https://api.runonflux.io/daemon/getinfo"
        - lang: 'JavaScript'
          source: |
            const response = await fetch('https://api.runonflux.io/daemon/getinfo');
            const daemonInfo = await response.json();
            console.log('Daemon version:', daemonInfo.data.version);
            console.log('Block count:', daemonInfo.data.blocks);
        - lang: 'Python'
          source: |
            import requests
            
            response = requests.get('https://api.runonflux.io/daemon/getinfo')
            daemon_info = response.json()
            
            print(f"Daemon version: {daemon_info['data']['version']}")
            print(f"Block count: {daemon_info['data']['blocks']}")
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/daemongetinfo'
