  /apps/appstats:
    get:
      tags:
        - Apps
      summary: App stats based on resource usage
      description: >-
        The container's current resource usage, in the shape of Docker's
        container-stats object but **narrowed** to the values FluxOS keeps:
        CPU totals, memory usage, limit and page cache, block I/O, network
        bytes, the CPU allocation and disk usage. The reading is at most five
        seconds old, and callers arriving together share one.


        Not returned (they are in Docker's raw object, and were in this
        response before FluxOS 8.18.0): `read`, `preread`, `id`, `name`,
        `pids_stats`, `num_procs`, `storage_stats`, `percpu_usage`,
        `usage_in_kernelmode`, `usage_in_usermode`, `throttling_data`,
        `precpu_stats.online_cpus`, `max_usage`, `failcnt`, every
        `memory_stats.stats` key except `inactive_file`, every `blkio_stats`
        list except `io_service_bytes_recursive`, and the per-interface packet,
        error and dropped counters. With `percpu_usage` gone, read
        `online_cpus` directly rather than falling back to that array's length.


        `memory_stats.stats.inactive_file` is the page cache to subtract from
        `usage` as `docker stats` does (cgroup v1's `cache` is reported under
        this name). `blkio_stats.io_service_bytes_recursive` is one `read` and
        one `write` entry summed across devices, or `null`. `nanoCpus` is the
        CPU allocation (1000000000 = one core).


        `disk_stats.status` is `success` when every mount was measured,
        `partial` when some could not be (listed in `unmeasured`; `used` is
        then a floor, not a total), `error` when the reading failed (`message`
        says why and every size is 0), or `stale` when a failed reading was
        replaced by the last measured one. **AppOwnerAbove**
      externalDocs:
        url: 'https://docs.docker.com/engine/api/v1.40/#operation/ContainerStats'
      operationId: AppStats
      security:
        - FluxID: []
      parameters:
        - in: query
          name: appname
          required: true
          schema:
            type: string
          description: Application name, or component_app
          example: myapp
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    description: The reading, in Docker's container-stats shape, narrowed as described above
              example:
                status: success
                data:
                  cpu_stats:
                    cpu_usage:
                      total_usage: 7296404247
                    system_cpu_usage: 516655370000000
                    online_cpus: 2
                  precpu_stats:
                    cpu_usage:
                      total_usage: 7294264247
                    system_cpu_usage: 516653230000000
                  memory_stats:
                    usage: 15024128
                    limit: 209715200
                    stats:
                      inactive_file: 126976
                  blkio_stats:
                    io_service_bytes_recursive:
                      - op: read
                        value: 12288
                      - op: write
                        value: 4096
                  networks:
                    eth0:
                      rx_bytes: 4191270113
                      tx_bytes: 300477601
                  nanoCpus: 2000000000
                  disk_stats:
                    bind: 33554432
                    volume: 8388608
                    rootfs: 0
                    used: 41943040
                    status: success
