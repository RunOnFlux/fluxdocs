  /daemon/createmultisig:
    post:
      tags:
        - Daemon
      summary: Create multi-sig address
      description: >-
        Creates a multi-signature address with n signature of n keys required.
        **Public**
      operationId: createMultiSigPost
      security: []
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: object
              properties:
                'n':
                  type: integer
                  description: >-
                    The number of required signatures out of the n keys or
                    addresses. Followed by Flux addresses in array of strings.
                keys:
                  type: array
                  description: >-
                    Array of keys which are Flux addresses or hex-encoded
                    public keys
                  items:
                    type: string
                    description: Flux address or hex-encoded public key
            example:
              'n': 2
              keys:
                - t1XcXfRFSnSeYmf2mbsMHzHbV8Qo5Zhk817
                - t1RAxsCaeeqB2XbZqvYU87uTMo9K2RtcA9z
