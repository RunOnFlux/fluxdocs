  /flux/dosstate:
    get:
      tags:
        - Flux
      summary: DOS state
      description: >-
        This node's DOS score and the reason for it. The node is out of service
        (DOS) at a score of 100 or more; a score above 10, or any message, already
        makes `GET /flux/health` and `GET /id/loginphrase` refuse. While a
        permanent hold is in place (a NodeJS below the network minimum, app
        tampering, the residential DOS or peer-set instability) `dosState` reads
        100 and `dosMessage` lists every holder's reason, joined by `; `.
        **Public**
      operationId: getDOSState
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      dosState:
                        type: integer
                        description: Status number
                      dosMessage:
                        type: string
                        nullable: true
                        description: Explanation of status
              example:
                status: success
                data:
                  dosState: 0
                  dosMessage: null
    post:
      tags:
        - Flux
      summary: Set the DOS state (test builds only)
      description: >-
        Sets the node's DOS state directly. **Available only on nodes started
        with `testEventStream` enabled** — every other node answers `404`. Exists
        so the event stream can be exercised deterministically in testing.
        **FluxTeam**
      operationId: setDOSState
      security:
        - FluxID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dosState:
                  type: number
                dosMessage:
                  type: string
                  nullable: true
            example:
              dosState: 100
              dosMessage: Simulated DOS for testing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
              example:
                status: success
                data:
                  message:
                    dosState: 100
                    dosMessage: Simulated DOS for testing
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Not available — this node was not started with test event streaming
  /flux/health:
    get:
      tags:
        - Flux
      summary: Node fitness
      description: >-
        Whether this node is fit to serve the network, by the same checks that
        gate `GET /id/loginphrase`, run in this order: the local database
        answers, Syncthing is healthy, Docker answers, the hardware still meets
        the node's tier, the node is not in a DOS state (score above 10 or any
        DOS message), and its apps are not in a DOS state (100 or more). The
        first failing check is answered as an error envelope carrying that
        check's message, name and code. For the node DOS check `code` is the DOS
        score and `name` is `DOS` for an IP-detection failure or collateral
        collision, `CONNERROR` otherwise.


        On success `data` names every check passed. `syncthing` is `ok` when a
        health probe landed within the health window, `unmeasured` while FluxOS
        has not yet measured it, and `degraded` when it is unhealthy on a node
        where FluxOS does not own the Syncthing daemon (ArcaneOS); only a node
        whose Syncthing FluxOS supervises is failed for it. Successful answers
        are cached for 30 seconds; failures are not cached. **Public**
      operationId: getNodeHealth
      security: []
      responses:
        '200':
          description: >-
            OK. An unfit node is also answered with HTTP 200, as an error
            envelope, e.g. `{status: error, data: {name: Error, message:
            Syncthing is not running properly}}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      db:
                        type: string
                        enum:
                          - ok
                      syncthing:
                        type: string
                        enum:
                          - ok
                          - unmeasured
                          - degraded
                      docker:
                        type: string
                        enum:
                          - ok
                      hardware:
                        type: string
                        enum:
                          - ok
                      dos:
                        type: string
                        enum:
                          - ok
                      appsDos:
                        type: string
                        enum:
                          - ok
              example:
                status: success
                data:
                  db: ok
                  syncthing: ok
                  docker: ok
                  hardware: ok
                  dos: ok
                  appsDos: ok
