  #Operations (long-running jobs)
  /apps/operations/{jobId}:
    get:
      tags:
        - Apps
      summary: Poll a long-running operation
      description: >-
        The single status resource for every long-running operation a node
        accepts. Endpoints that start work (the volume file operations, for
        example) answer `202 Accepted` with a `jobId`, a `Location` header
        pointing here and an `Operation-Id` header; this endpoint owns the
        polling contract.


        A running operation answers `200` with a non-terminal body and a
        `Retry-After` header. **Completion is read from the `status` field, never
        inferred from the HTTP code** — a failed operation is still a successful
        poll. Terminal statuses are `Succeeded`, `Failed`, `Canceled` and
        `Evicted` (the node took the work away — neither the caller's request nor
        their input was at fault).


        Unknown, expired and not-yours are one answer (`404`): a `jobId` must not
        tell a caller whether someone else has an operation running. Operations
        registered with an owner are readable only by that FluxID; operations
        registered without one treat the `jobId` itself as the capability.
        **Public** (the `jobId` is the capability)
      operationId: getOperation
      security: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
          description: Operation id, as returned by the endpoint that started the work
          example: op_2f8f1a1c-1a2b-4c3d-9e8f-0a1b2c3d4e5f
        - in: query
          name: sinceSeq
          required: false
          schema:
            type: integer
            minimum: 0
          description: >-
            How far through an operation's line-numbered output the caller has
            already read. Anything that is not a non-negative whole number is
            treated as no cursor at all.
          example: 120
      responses:
        '200':
          description: Operation state
          headers:
            Retry-After:
              description: Seconds to wait before polling again (running operations only)
              schema:
                type: integer
            Expires:
              description: When a terminal operation will be pruned from the registry
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/operation'
              example:
                status: success
                data:
                  jobId: op_2f8f1a1c-1a2b-4c3d-9e8f-0a1b2c3d4e5f
                  kind: fileoperation.copy
                  status: Running
                  createdAt: 1772719200000
                  lastUpdatedAt: 1772719214000
                  progress:
                    - Copying...
                  error: null
                  detail:
                    app: mycomponent_myapp
                    operation: fileoperation.copy
                    bytesDone: 41943040
                    bytesTotal: 104857600
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Operation not found, expired, or not readable by this caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: error
                data:
                  message: Operation not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Apps
      summary: Cancel a long-running operation
      description: >-
        Requests cancellation of an operation. **Best effort, and said so
        plainly**: the flag is raised here and the worker stops at its next
        checkpoint, so `status` stays `Running` until it does. Poll
        `GET /apps/operations/{jobId}` for the terminal state. **Public** (the
        `jobId` is the capability)
      operationId: cancelOperation
      security: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
          description: Operation id
          example: op_2f8f1a1c-1a2b-4c3d-9e8f-0a1b2c3d4e5f
      responses:
        '200':
          description: Cancellation requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      jobId:
                        type: string
                      cancelRequested:
                        type: boolean
                      status:
                        type: string
                        description: The operation status at the moment of the request
              example:
                status: success
                data:
                  jobId: op_2f8f1a1c-1a2b-4c3d-9e8f-0a1b2c3d4e5f
                  cancelRequested: true
                  status: Running
        '404':
          description: Operation not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: error
                data:
                  message: Operation not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  #Volume file operations
  /apps/moveobject:
    post:
      tags:
        - Volume Browser
      summary: Move a file or folder within an app volume
      description: >-
        Moves `source` to `destination` inside the application's persistent
        volume. Both operands are resolved relative to the volume root; a path
        that escapes it is refused.


        Answers `202 Accepted` with a `jobId` — poll
        `GET /apps/operations/{jobId}`. A move is registered as a job like the
        other three because paste is one gesture in a file browser: cut-paste
        returning a result while copy-paste returned a job would put two response
        shapes inside a single user action. **AppOwnerAbove**
      operationId: moveAppsObject
      security:
        - FluxID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/volumeObjectOperation'
            example:
              appname: myapp
              component: mycomponent
              source: data/report.csv
              destination: archive/report.csv
              overwrite: false
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: >-
            Refused before any work starts: another file operation is running
            for this application, the node is at its concurrent-operation limit,
            the file-operation image is still being fetched, or the node is
            still reconciling its applications after boot. `Retry-After` says
            when to retry; `data.operation` (jobId, kind, statusUrl) names the
            operation being waited behind, when there is one.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
  /apps/copyobject:
    post:
      tags:
        - Volume Browser
      summary: Copy a file or folder within an app volume
      description: >-
        Copies `source` to `destination` inside the application's persistent
        volume, preserving ownership, timestamps and symlinks. The volume's free
        space is checked against the measured size of the source before the copy
        starts, and the ceiling is enforced against what actually lands.


        A directory copied onto an existing directory overlays it rather than
        replacing it wholesale; a file over a file is replaced, and a file over a
        directory is refused. Answers `202 Accepted` with a `jobId` — poll
        `GET /apps/operations/{jobId}`. **AppOwnerAbove**
      operationId: copyAppsObject
      security:
        - FluxID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/volumeObjectOperation'
            example:
              appname: myapp
              component: mycomponent
              source: data
              destination: backup/data
              overwrite: false
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: >-
            Refused before any work starts: another file operation is running
            for this application, the node is at its concurrent-operation limit,
            the file-operation image is still being fetched, or the node is
            still reconciling its applications after boot. `Retry-After` says
            when to retry; `data.operation` (jobId, kind, statusUrl) names the
            operation being waited behind, when there is one.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
  /apps/compressobject:
    post:
      tags:
        - Volume Browser
      summary: Compress a file or folder into an archive
      description: >-
        Creates an archive of `source` at `destination` inside the application's
        persistent volume. The destination extension chooses the format and must
        be one of `.zip`, `.tar.gz` or `.tgz`; anything else is refused.


        `source` is one path or a list of paths. One path: a directory's
        *contents* are archived at the top level (a file goes in under its own
        name), so extracting the archive to a destination reproduces the source
        under that name. A list (at most 1000 entries; an entry may not be
        listed twice or sit inside another listed entry): each entry is
        archived by its path relative to the deepest folder holding all of
        them, and a directory arrives as that directory — what a file browser
        sends for a selection, even of one item. The archive's size is bounded
        as it is written (the volume's free space), not measured up front.
        Answers `202 Accepted` with a `jobId` — poll
        `GET /apps/operations/{jobId}`. **AppOwnerAbove**
      operationId: compressAppsObject
      security:
        - FluxID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/volumeObjectOperation'
            examples:
              folder:
                summary: One folder, its contents at the archive's top level
                value:
                  appname: myapp
                  component: mycomponent
                  source: data
                  destination: backup/data.tar.gz
                  overwrite: false
              selection:
                summary: A selection, each entry by its path from the deepest common folder
                value:
                  appname: myapp
                  component: mycomponent
                  source:
                    - logs/a.txt
                    - notes.txt
                  destination: backup/selection.zip
                  overwrite: false
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: >-
            Refused before any work starts: another file operation is running
            for this application, the node is at its concurrent-operation limit,
            the file-operation image is still being fetched, or the node is
            still reconciling its applications after boot. `Retry-After` says
            when to retry; `data.operation` (jobId, kind, statusUrl) names the
            operation being waited behind, when there is one.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
  /apps/extractobject:
    post:
      tags:
        - Volume Browser
      summary: Extract an archive within an app volume
      description: >-
        Extracts the archive at `source` to `destination` inside the
        application's persistent volume. The source is accepted by extension
        rather than by sniffing its content — `.zip`, `.tar.gz` or `.tgz` — so a
        caller who names what they uploaded cannot have it interpreted as
        something else.


        How much an extraction will write cannot be measured up front, so the
        volume's remaining capacity is the only bound: on a full volume the
        request is refused outright rather than expressed as a limit nothing
        enforces. Answers `202 Accepted` with a `jobId` — poll
        `GET /apps/operations/{jobId}`. **AppOwnerAbove**
      operationId: extractAppsObject
      security:
        - FluxID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/volumeObjectOperation'
            example:
              appname: myapp
              component: mycomponent
              source: backup/data.tar.gz
              destination: data
              overwrite: true
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: >-
            Refused before any work starts: another file operation is running
            for this application, the node is at its concurrent-operation limit,
            the file-operation image is still being fetched, or the node is
            still reconciling its applications after boot. `Retry-After` says
            when to retry; `data.operation` (jobId, kind, statusUrl) names the
            operation being waited behind, when there is one.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
  /apps/fileoperationimage/{imageid}:
    get:
      tags:
        - Volume Browser
      summary: Serve a container image to a peer node
      description: >-
        Node-to-node transfer of the file-operation image (the image volume file
        operations run in) to a peer node that cannot pull it from the registry.
        The caller is identified by its remote address rather than by a
        forwarded header, and the requested `imageid` is *compared* against the
        images this node expects to hold — never used to look one up — so there
        is no "send me image X" here. A caller that is not a confirmed node, or
        an id this node does not hold, gets `403`/`404` respectively; a node
        already serving the image to its maximum number of peers answers `503`.
        **Public** (peer nodes only)
      operationId: serveImageToPeer
      security: []
      parameters:
        - in: path
          name: imageid
          required: true
          schema:
            type: string
          description: >-
            The image id as the *calling* node's daemon files it, which need not
            be what this node's daemon calls it
          example: sha256:6a1f8b3c9d2e4f5a6b7c8d9e0f1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c
      responses:
        '200':
          description: Image stream
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        '400':
          description: Remote address could not be determined
        '403':
          description: Caller is not a node entitled to this image
        '404':
          description: This node does not hold the requested image
        '503':
          description: This node is already serving the image to its maximum number of peers; retry after `Retry-After`
          headers:
            Retry-After:
              schema:
                type: integer
  #Apps - placement, inspection and peer queries
  /apps/placementfeasibility:
    post:
      tags:
        - Apps
      summary: Ask whether a specification can be placed
      description: >-
        Answers whether a prospective application specification can reach its
        instance count on the network as it stands right now, and with how much
        provider diversity. Send the specification you are about to register.


        `category` is the availability promise the network can make:

        - `impossible` — fewer eligible nodes than instances. Every
          approximation counts *toward* eligibility, so the shortfall is proven
          and registration will reject the spec.

        - `constrained` — the instance count is reachable, but a synced app's
          instances outnumber the available fault domains, so some instances must
          share a provider. Deliverable, with less resiliency than the instance
          count implies; registration warns.

        - `ok` — the requested count and diversity are both deliverable.


        Returns `503` while the node list or the IP location table is still
        filling in, rather than answering from a partial view. **User**
      operationId: placementFeasibility
      security:
        - FluxID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                An application specification. Only the placement-relevant fields
                are read — `instances`, `geolocation`, and the per-component
                `cpu`/`ram`/`hdd`/`tiered` and `containerData` (which decides
                whether a component is synced).
            example:
              instances: 5
              geolocation:
                - acEU
              compose:
                - name: mycomponent
                  cpu: 2
                  ram: 4000
                  hdd: 40
                  tiered: false
                  containerData: /data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/placementAdvice'
              example:
                status: success
                data:
                  instances: 5
                  candidateCount: 1832
                  domainCount: 964
                  maxPerDomain: 1
                  placeable: true
                  tableAvailable: true
                  tableGenerated: '2026-09-01T00:00:00.000Z'
                  syncedApp: true
                  category: ok
                  constrained: false
                  satisfiable: true
                  normalizedGeolocation:
                    - acEU
                  coarsenedEntries: []
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /apps/placementlocations:
    get:
      tags:
        - Apps
      summary: Live placement geography
      description: >-
        Node, fault-domain and tier counts per continent and country, taken from
        this node's own IP location table in one pass over the confirmed node
        list. Nodes the table cannot resolve are counted in `unresolved` rather
        than guessed at.


        Returns `503` while the node list is still filling in, and reports
        `tableAvailable: false` when the location table itself is absent — the
        tree *is* the product here, so its absence is unavailability rather than
        an empty answer. Query parameters are rejected. **Public**
      operationId: placementLocations
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      tableAvailable:
                        type: boolean
                      tableGenerated:
                        type: string
                        nullable: true
                      total:
                        type: object
                        properties:
                          nodes:
                            type: integer
                          domains:
                            type: integer
                      unresolved:
                        type: integer
                        description: Nodes the location table could not resolve
                      continents:
                        type: object
                        description: Per-continent tree, each carrying its countries and tier counts
              example:
                status: success
                data:
                  tableAvailable: true
                  tableGenerated: '2026-09-01T00:00:00.000Z'
                  total:
                    nodes: 6387
                    domains: 3204
                  unresolved: 12
                  continents:
                    EU:
                      nodes: 2810
                      domains: 1490
                      tiers:
                        CUMULUS: 1402
                        NIMBUS: 701
                        STRATUS: 707
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /apps/heldcomponents:
    get:
      tags:
        - Apps
      summary: Application components this node holds
      description: >-
        Every application component this node holds — the union of the
        containers running right now, the identifiers the reconciler has
        committed to, and the components an operator has explicitly stopped. A
        component that is stopped is still held.


        Asked by peers during placement; running containers are read from
        Docker per request, behind a one-second cache. Query parameters are
        rejected. **Public**
      operationId: heldComponents
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: array
                    items:
                      type: string
              example:
                status: success
                data:
                  - fluxmycomponent_myapp
                  - fluxwordpress
  /apps/promotedfolders:
    get:
      tags:
        - Apps
      summary: Syncthing folders promoted on this node
      description: >-
        The Syncthing folder ids this node has promoted to `sendreceive` — the
        folders it holds the writable copy of. Asked by a peer before it promotes
        a folder of its own.


        `ready` is `false` until the Syncthing monitor has completed its first
        pass; the `folders` list is empty until then and must not be read as "this
        node has promoted nothing". Query parameters are rejected. POST the
        same path to also receive what each receive-only folder holds.
        **Public**
      operationId: promotedFolders
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      ready:
                        type: boolean
                        description: Whether the monitor has produced a view yet
                      folders:
                        type: array
                        items:
                          type: string
              example:
                status: success
                data:
                  ready: true
                  folders:
                    - fluxmycomponent_myapp
    post:
      tags:
        - Apps
      summary: Promoted Syncthing folders, with what each receive-only folder holds
      description: >-
        The same answer as `GET /apps/promotedfolders`, plus `holding`: for each
        receive-only Syncthing folder on this node, how many bytes of the owner's
        data it holds that the cluster index does not (`bytes`), and when that
        data was last written (`newestModified`, Unix ms). A peer asks for it
        before promoting a folder of its own, so the node that holds the data
        wins the election rather than the node with the lowest address.


        `holding` is the application owner's information, so it is only included
        for a caller entitled to it: a Flux Team session (`zelidauth` header), or
        a body signed by a node on the deterministic node list. A signed body
        carries `target` (the `ip:port` of the node being asked, checked against
        this node's own address so a captured request cannot be replayed at
        another node), `timestamp` (a JSON number, Unix ms, no older than
        5 minutes and no more than 2 minutes ahead of this node's clock),
        `pubKey` (the asking node's public key as it appears on the node list)
        and `signature` (by that key, over `JSON.stringify` of the body without
        `signature`, keys in the order sent). Any other caller gets the open
        answer — `ready` and `folders` without `holding` — rather than an error.


        Answers **HTTP 503** while this node's network state has not started,
        instead of waiting for the node list; a peer reads that as "alive, not
        ready". The body is read as JSON (`Content-Type: application/json`).
        **Public** (`holding`: **FluxTeam** or a signed Fluxnode request)
      operationId: promotedFolderHoldings
      security:
        - {}
        - FluxID: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  description: '`ip:port` of the node being asked; a bare IP means port 16127'
                timestamp:
                  type: integer
                  description: Unix milliseconds
                pubKey:
                  type: string
                  description: Public key of the asking node, as listed on the deterministic node list
                signature:
                  type: string
                  description: Signature by `pubKey` over `JSON.stringify` of the body without `signature`
            example:
              target: '203.0.113.10:16127'
              timestamp: 1772719200000
              pubKey: 04c2b8b...
              signature: H+ZB3oSrsw6XkBxxlbwk33LEBJ...
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      ready:
                        type: boolean
                        description: Whether the Syncthing monitor has completed its first pass
                      folders:
                        type: array
                        description: Folder ids this node has promoted to sendreceive
                        items:
                          type: string
                      holding:
                        type: object
                        description: >-
                          Present only for an entitled caller. Folder id to what this
                          node holds in it; `{}` before the monitor has measured anything.
                        additionalProperties:
                          type: object
                          properties:
                            bytes:
                              type: integer
                            newestModified:
                              type: integer
                              description: Unix milliseconds
              example:
                status: success
                data:
                  ready: true
                  folders:
                    - fluxmycomponent_myapp
                  holding:
                    fluxothercomponent_otherapp:
                      bytes: 6227702579
                      newestModified: 1772719100000
        '503':
          description: This node's network state has not started, so it cannot yet tell who is asking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
              example:
                status: error
                data:
                  code: 503
                  name: ServiceUnavailable
                  message: Network state is not ready
  /apps/appcomponentnames:
    get:
      tags:
        - Apps
      summary: Component names of an application
      description: >-
        The component names of a registered application, each with whether it
        is a g: (masterSlave) component, and the application's total
        cpu/ram/hdd. A component_app name is accepted. Restricted to the Flux
        Team rather than the owner: an owner reads the specification itself and
        has no use for this, and the node operator is not a party to a
        customer's app at all. **FluxTeam**
      operationId: getApplicationComponentNames
      security:
        - FluxID: []
      parameters:
        - in: query
          name: appname
          required: true
          schema:
            type: string
          description: Application name
          example: myapp
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
              example:
                status: success
                data:
                  components:
                    - name: mycomponent
                      masterSlave: false
                  resources:
                    cpu: 0.5
                    ram: 1000
                    hdd: 5
  /apps/messagescount:
    get:
      tags:
        - Apps
      summary: Count of app messages by owner
      description: >-
        How many global application messages carry the given owner. **Public**
      operationId: getAppsMessagesCount
      security: []
      parameters:
        - in: query
          name: appowner
          required: true
          schema:
            type: string
          description: Owner FluxID
          example: 1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: integer
              example:
                status: success
                data: 17
  /apps/tamperingevents:
    get:
      tags:
        - Apps
      summary: Runtime tampering events
      description: >-
        Containers on this node whose running image no longer matches the image
        of the registered specification, most recently seen first. Reported per
        application when `appname` is given, otherwise across every application
        on the node. **Public**
      operationId: getTamperingEvents
      security: []
      parameters:
        - in: query
          name: appname
          required: false
          schema:
            type: string
          description: Restrict to one application
          example: myapp
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
          description: Maximum events to return; clamped to the service maximum
          example: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        appName:
                          type: string
                        detectedAt:
                          type: string
                        lastSeen:
                          type: string
              example:
                status: success
                data:
                  - appName: myapp
                    detectedAt: '2026-09-01T09:14:00.000Z'
                    lastSeen: '2026-09-01T11:02:00.000Z'
  /apps/appkill:
    get:
      tags:
        - Apps
      summary: Kill an app
      description: >-
        Stops the application's containers with a kill signal rather than a
        graceful stop. A kill is a stop that carries a signal, so it is recorded
        as the same desired state with a mode — the reconciler applies it where
        it stops the container. **AppOwnerAbove**
      operationId: appKill
      security:
        - FluxID: []
      parameters:
        - in: query
          name: appname
          required: true
          schema:
            type: string
          description: Application or component name
          example: myapp
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: string
              example:
                status: success
                data: Application myapp killed
  /apps/appmonitor:
    get:
      tags:
        - Apps
      summary: App monitoring data
      description: >-
        Stored CPU, memory, network and disk samples for an application on this
        node. **AppOwnerAbove**
      operationId: appMonitor
      security:
        - FluxID: []
      parameters:
        - in: query
          name: appname
          required: true
          schema:
            type: string
          description: Application or component name
          example: myapp
        - in: query
          name: range
          required: false
          schema:
            type: integer
            minimum: 1
          description: >-
            Window in milliseconds back from now; all stored samples when
            omitted. Windows longer than a day are thinned to one sample per
            hour.
          example: 3600000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: integer
                          description: Unix milliseconds
                        data:
                          type: object
                          description: The sample, in Docker's container-stats shape
              example:
                status: success
                data:
                  - timestamp: 1772719200000
                    data:
                      cpu_stats:
                        cpu_usage:
                          total_usage: 123456789
                        system_cpu_usage: 987654321000
                        online_cpus: 4
                      memory_stats:
                        usage: 52428800
                        limit: 1048576000
  /apps/redeploycomponent:
    get:
      tags:
        - Apps
      summary: Redeploy a single component
      description: >-
        Redeploys one component of a composed application on this node without
        touching its siblings. `appname` is the *application* name and `component`
        the component name — an `appname` containing an underscore is refused.


        With `force`, the redeploy is the hard one: the component's volume is
        unmounted and removed, so the app's data on this node is gone. Skipped
        while a restore is running for the application. **AppOwnerAbove**
      operationId: redeployComponent
      security:
        - FluxID: []
      parameters:
        - in: query
          name: appname
          required: true
          schema:
            type: string
          description: Application name (not `component_app`)
          example: myapp
        - in: query
          name: component
          required: true
          schema:
            type: string
          description: Component name
          example: mycomponent
        - in: query
          name: force
          required: false
          schema:
            type: boolean
          description: Hard redeploy — removes the component's volume and data on this node
          example: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: Component mycomponent of myapp redeployed
        '503':
          description: >-
            Refused before the handler runs: the node is still reconciling its
            applications after boot (Retry-After 15), or has not yet obtained the
            network policy — the signed bundle carrying the blocked-repository
            list — so it cannot establish that an image is allowed (Retry-After 30).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
              example:
                status: error
                data:
                  code: 503
                  name: ServiceUnavailable
                  message: Node has not yet obtained the network policy
  /flux/peers:
    get:
      tags:
        - Flux
      summary: Connected peers
      description: >-
        Detailed information about every peer connection this node holds, in
        both directions. To narrow the list use `GET /flux/peers/{filter}`; the
        filter is read from the path only, and a `filter` query parameter is
        ignored. **Public**
      operationId: getPeers
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: array
                    items:
                      type: object
              example:
                status: success
                data:
                  - ip: 202.61.234.13
                    port: '16127'
                    direction: outbound
                    latency: 42
                    missedPongs: 0
                    lastPingTime: 1772719195000
                    lastPongTime: 1772719195042
                    connectedAt: 1772712000000
                    uptime: 7200000
                    source: deterministic
                    isAlive: true
                    badMessages: 0
                    capabilities: []
                    remoteClockOffsetMs: 3
                    lastTransmissionDelay: 12
                    messagesReceived: 5120
                    messagesSent: 4980
                    bytesReceived: 7340032
                    bytesSent: 6291456
                    remoteVersion: 8.20.0
                    reconnects: 0
  /flux/peers/{filter}:
    get:
      tags:
        - Flux
      summary: Connected peers, filtered
      description: >-
        `GET /flux/peers` narrowed by a path segment: `outbound` or `inbound`
        restrict the list to one direction, and an `ip:port` returns that single
        peer as an object (an error envelope `Peer <ip:port> not found` when no
        such connection exists). Any other value returns every peer. **Public**
      operationId: getPeersFiltered
      security: []
      parameters:
        - in: path
          name: filter
          required: true
          schema:
            type: string
          description: '`outbound`, `inbound`, or a peer''s `ip:port`'
          example: outbound
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    oneOf:
                      - type: array
                        items:
                          type: object
                      - type: object
              example:
                status: success
                data:
                  - ip: 202.61.234.13
                    port: '16127'
                    direction: outbound
                    latency: 42
                    source: deterministic
                    isAlive: true
                    connectedAt: 1772712000000
                    uptime: 7200000
  /flux/unstablenodes:
    get:
      tags:
        - Flux
      summary: Nodes flagged as unstable
      description: >-
        Peers this node has seen disconnect five or more times within the
        tracking window, with the count and the time of the first disconnect.
        **Public**
      operationId: getUnstableNodes
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ip:
                          type: string
                        port:
                          type: string
                        disconnects:
                          type: integer
                        firstDisconnect:
                          type: integer
              example:
                status: success
                data:
                  - ip: 202.61.234.13
                    port: '16127'
                    disconnects: 7
                    firstDisconnect: 1772712000000
  /flux/peerhistory:
    get:
      tags:
        - Flux
      summary: Peer connection history
      description: >-
        Connection and disconnection events from this node's peer history ring
        buffer, oldest first (`limit` keeps the most recent N). Every filter is
        optional and they combine.
        **AdminAndFluxTeam**
      operationId: getPeerHistory
      security:
        - FluxID: []
      parameters:
        - in: query
          name: ip
          required: false
          schema:
            type: string
          description: IP or IP prefix to match
          example: '75.6.52'
        - in: query
          name: code
          required: false
          schema:
            type: integer
          description: WebSocket close code, matched against each event's `closeCode`
          example: 4004
        - in: query
          name: event
          required: false
          schema:
            type: string
          description: Event type
          example: disconnected
        - in: query
          name: limit
          required: false
          schema:
            type: integer
          description: Most recent N events
          example: 50
        - in: query
          name: since
          required: false
          schema:
            type: integer
          description: Unix milliseconds; only events after this moment
          example: 1773520000000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: array
                    items:
                      type: object
              example:
                status: success
                data:
                  - ip: 75.6.52.11
                    port: '16127'
                    direction: inbound
                    event: disconnected
                    closeCode: 4004
                    timestamp: 1773520100000
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /flux/topology:
    get:
      tags:
        - Flux
      summary: Peer-exchange topology
      description: >-
        What this node's peers have reported about *their* peers: an
        `outbound`/`inbound` list per reporting node, with the number of
        reporters and of distinct known peers. **Public**
      operationId: getTopology
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      reporters:
                        type: integer
                      knownPeers:
                        type: integer
                      topology:
                        type: object
              example:
                status: success
                data:
                  reporters: 24
                  knownPeers: 312
                  topology:
                    '202.61.234.13:16127':
                      outbound:
                        - '95.216.1.2:16127'
                      inbound:
                        - '51.15.3.4:16127'
  /flux/networkhealth:
    get:
      tags:
        - Flux
      summary: Network health and diagnosis history
      description: >-
        This node's view of network health: the monitor's current status, whether
        it considers the network to be in steady state, and its recent diagnosis
        history. **Public**
      operationId: getNetworkHealth
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      status:
                        type: object
                      inSteadyState:
                        type: boolean
                      history:
                        type: array
                        items:
                          type: object
              example:
                status: success
                data:
                  status:
                    healthy: true
                  inSteadyState: true
                  history: []
  /flux/clockdrift:
    get:
      tags:
        - Flux
      summary: Clock drift of this node
      description: >-
        The node's time offset as reported by its NTP client (`chrony` or
        `systemd-timesyncd`), with the source that answered and the node's own
        Unix time in seconds. A node whose clock has drifted is refused by
        signature-gated peer endpoints, so this is the first thing to check when
        those return "stale". **Public**
      operationId: clockDrift
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      source:
                        type: string
                        description: '`chrony`, `timesyncd`, or none detected'
                      offset:
                        type: number
                        description: Offset in seconds
                      time:
                        type: integer
                        description: Node time, Unix seconds
              example:
                status: success
                data:
                  source: chrony
                  offset: 0.000184
                  time: 1772719200
  /flux/enterpriseappowners:
    get:
      tags:
        - Flux
      summary: Enterprise application owners
      description: >-
        The FluxIDs allowed to install on enterprise nodes: the union of every
        enterprise node's allowed owners, read from the signed network policy
        bundle this node holds. Until the node has obtained that policy it
        answers an error envelope, `Network policy not yet obtained`, rather than
        an empty list; the error is not cached, a successful answer is cached for
        an hour. **Public**
      operationId: getEnterpriseAppOwners
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: array
                    items:
                      type: string
              example:
                status: success
                data:
                  - 1CbErtneaX2QVyUfwU7JGB7VzvPgrgc3uC
  /flux/portsinuse:
    post:
      tags:
        - Flux
      summary: Ports in use on this node
      description: >-
        The ports this node currently has in use, returned **signed** so the
        caller can attribute the answer to this node.


        Two kinds of caller are accepted. A peer node signs its ask with
        `pubKey`, `signature` and `timestamp`; the timestamp window is checked
        *before* the signature, so an ask outside it is refused as stale
        regardless of who sent it — a node whose clock has drifted can read which
        problem it has from one line. A node operator or the Flux team may
        instead authenticate with a `zelidauth` header and send an empty body.
        **AdminAndFluxTeam** (or a signed peer request)
      operationId: portsInUse
      security:
        - FluxID: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pubKey:
                  type: string
                  description: Public key of the asking node
                signature:
                  type: string
                timestamp:
                  type: integer
                  description: Unix milliseconds; the ask is refused outside its validity window
            example:
              pubKey: 04c2b8b...
              signature: H+ZB3oSrsw6XkBxxlbwk33LEBJ...
              timestamp: 1772719200000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      pubKey:
                        type: string
                        description: Public key of the answering node
                      ports:
                        type: array
                        items:
                          type: integer
                      askedAt:
                        type: integer
                        nullable: true
                      signature:
                        type: string
                        description: This node's signature over the answer
              example:
                status: success
                data:
                  pubKey: 04a1f3d...
                  ports:
                    - 31350
                    - 31351
                  askedAt: 1772719200000
                  signature: IHs1c2...
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /flux/addoutgoingpeer:
    get:
      tags:
        - Flux
      summary: Ask this node to connect back to you
      description: >-
        Asks this node to open an outgoing connection to the given `ip`. The
        request is only honoured when it comes *from* that address and the
        address belongs to a confirmed node, so a node can ask a peer to connect
        back to it but cannot direct a peer at a third party. Refused while this
        node is unconfirmed, or when the connection already exists. **Public**
        (self-attested)
      operationId: addOutgoingPeer
      security: []
      parameters:
        - in: query
          name: ip
          required: true
          schema:
            type: string
          description: '`ip` or `ip:port` — must match the requester''s own address'
          example: '202.61.234.13:16127'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: Outgoing connection to 202.61.234.13:16127 initiated
  /flux/startdiscovery:
    get:
      tags:
        - Flux
      summary: Start peer discovery
      description: >-
        Starts this node's peer discovery loop. **FluxTeam**
      operationId: startDiscovery
      security:
        - FluxID: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    $ref: '#/components/schemas/statusmessage'
              example:
                status: success
                data:
                  message: Discovery started
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /flux/currentbranch:
