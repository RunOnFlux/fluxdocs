  /daemon/getdifficulty:
    get:
      tags:
        - Daemon
      summary: Proof of work difficulty
      description: >-
        Returns the proof-of-work difficulty as a multiple of the minimum
        difficulty. **Public**
      operationId: getDifficulty
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: number
                    description: Proof of work difficulty as a multiple
              example:
                status: success
                data: 2572.645186022886
  /daemon/getmempoolinfo:
    get:
      tags:
        - Daemon
      summary: Memory pool info
      description: Returns details on the active state of the TX memory pool. **Public**
      operationId: getMempoolInfo
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      size:
                        type: integer
                        description: Current tx count
                      bytes:
                        type: integer
                        description: Sum of all tx sizes
                      usage:
                        type: integer
                        description: Total memory usage for the mempool
              example:
                status: success
                data:
                  size: 0
                  bytes: 0
                  usage: 0
  /daemon/getrawmempool:
    get:
      tags:
        - Daemon
      summary: Transaction ids in memory pool
      description: >-
        Returns all transaction ids in memory pool as a json array of string.
        **Public**
      operationId: getRawMemPool
      security: []
      parameters:
        - in: query
          name: verbose
          schema:
            default: false
            type: boolean
            enum:
              - true
              - false
          description: |
            True for a json object, false for array of transaction ids.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: object
                    properties:
                      txid:
                        type: object
                        properties:
                          size:
                            type: integer
                            description: Transaction size in bytes
                          fee:
                            type: integer
                            description: Transaction fee in FLUX
                          time:
                            type: integer
                            description: >-
                              Local time transaction entered pool in seconds
                              since 1 Jan 1970 GMT
                          height:
                            type: integer
                            description: Block height when transaction entered pool
                          startingpriority:
