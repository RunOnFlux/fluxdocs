  /daemon/viewdeterministicfluxnodelist:
    get:
      tags:
        - Daemon
      summary: Deterministic FluxNode list
      description: >-
        Same handler and answer as `GET /daemon/listfluxnodes` (fluxd
        `listfluxnodes`): the ranked FluxNode list, optionally filtered and
        limited. **Public**
      operationId: viewDeterministicFluxNodeList
      security: []
      parameters:
        - in: query
          name: filter
          schema:
            type: string
          description: >-
            Accepts both viewdeterministicfluxnodelist/filter and
            ?filter=193.188.15.238. Filter query will filter list by ,txhash,
            payment address, ip, or pubkey. If ommited, full list will be
            displayed.
          example: 193.188.15.238
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 9999999
          description: >-
            Return only the first `limit` entries of the ranked list. Applied
            only to a successful answer and only when the value is a whole
            number from 1 to 9999999 without a leading zero; any other value
            is ignored and the full list is returned.
          example: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: array
                    items:
                      type: object
