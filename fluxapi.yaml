      description: >-
        Data of changes made to container. If no changes it will return a null
        response which is usually the case. **AppOwnerAbove**


        Kind values:

        - `0 = Modified`

        - `1 = Added`

        - `2 = Deleted`
      operationId: AppChanges
      security:
        - FluxID: []
      parameters:
        - in: query
          name: appname
          required: true
          schema:
            type: string
          description: Application name, or component_app
          example: myapp
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/status'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Path to changed file
                        kind:
                          type: integer
                          enum:
                            - 0
                            - 1
                            - 2
                          description: Change type
              example:
                status: success
                data:
                  - null
  /apps/appexec:
    post:
      tags:
        - Apps
      summary: Run a command in the container
      description: >-
        Run new commands inside running containers. Asked of a node that does
        not run the application, it answers an error saying so. **AppOwnerAbove**
      operationId: AppExec
      security:
        - FluxID: []
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: object
              properties:
                appname:
                  type: string
                  description: App name
                cmd:
                  type: array
                  items:
                    type: string
                    description: Command to run
                env:
                  type: array
                  items:
                    type: string
                    description: New list of environment variables(optional)
            example:
              appname: dibi-UND
              cmd:
               - date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
                description: Output depends on the command
              example: 'Sun Sep 20 10:18:38 UTC 2020'
  /apps/appremove:
    get:
      tags:
        - Apps
      summary: Uninstall application
      description: >-
        This will stop, clean data, close port, and remove the container.
        `appname` is the application name; component names (containing `_`)
        are refused. The response is a stream of status objects; with `global`
        it is a single envelope. **AppOwnerAbove**
      operationId: Appremove
      security:
        - FluxID: []
      parameters:
        - in: query
          name: appname
          required: true
          schema:
            type: string
          description: Name of the app
          example: myapp
        - in: query
          name: force
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            Defaults to false. If true, forces removal without checking if the app exists.
        - in: query
          name: global
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            Defaults to false (local removal). If true, removes the app from all nodes in the network.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/streamdata'
              example:
                status: Flux App myapp was successfully removed
